<style>
/* ===== CanvasDesk v2 — zinc/amber design system ===== */
:root{
  --bg:#09090b;--bg2:#18181b;--card:rgba(24,24,27,.5);--card-solid:#18181b;
  --line:#27272a;--line-soft:rgba(39,39,42,.7);
  --txt:#fafafa;--txt2:#d4d4d8;--mut:#a1a1aa;--mut2:#71717a;--dim:#52525b;
  --amber:#fbbf24;--amber2:#fcd34d;--amber-soft:rgba(251,191,36,.1);
  --orange:#f97316;--teal:#2dd4bf;--rose:#fb7185;
  --r:16px;--r2:24px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{overflow-x:clip}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{background:var(--bg);color:var(--txt);font:16px/1.6 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
img,svg{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
.wrap{max-width:80rem;margin:0 auto;padding:0 1rem}
@media(min-width:640px){.wrap{padding:0 1.5rem}}
@media(min-width:1024px){.wrap{padding:0 2rem}}
section{scroll-margin-top:5rem}
.kicker{font-size:.875rem;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--amber)}
h2.sec-title{margin-top:.5rem;font-size:1.875rem;font-weight:700;letter-spacing:-.02em;color:var(--txt);line-height:1.2}
@media(min-width:640px){h2.sec-title{font-size:2.25rem}}
.sec-sub{margin-top:1rem;color:var(--mut);line-height:1.65;max-width:42rem}
.sec-head{max-width:42rem}
@media(min-width:1024px){.sec-pad{padding:6rem 0}.sec-pad-sm{padding:4rem 0}}
.sec-pad{padding:4rem 0}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ===== Announcement bar ===== */
#announcement{background:var(--amber);color:#09090b}
#announcement .in{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.35rem .75rem;padding:.5rem 1rem;text-align:center;font-size:.8rem;font-weight:500}
@media(min-width:640px){#announcement .in{font-size:.875rem}}
#announcement .cta{display:inline-flex;align-items:center;gap:.25rem;border-radius:99px;background:rgba(9,9,11,.1);padding:.125rem .625rem;font-weight:600}
#announcement .cta:hover{background:rgba(9,9,11,.2);text-decoration:underline}

/* ===== Header ===== */
header.site{position:sticky;top:0;z-index:50;border-bottom:1px solid var(--line-soft);background:rgba(9,9,11,.8);backdrop-filter:blur(12px)}
.hrow{display:flex;height:4rem;align-items:center;justify-content:space-between;gap:1rem}
.logo{display:flex;align-items:center;gap:.625rem}
.logo .mark{display:flex;height:2.25rem;width:2.25rem;align-items:center;justify-content:center;border-radius:.75rem;background:linear-gradient(135deg,var(--amber),var(--orange));color:#09090b;box-shadow:0 8px 20px rgba(251,191,36,.2)}
.logo .name{font-size:1.125rem;font-weight:700;letter-spacing:-.02em}
.logo .name b{color:var(--amber);font-weight:700}
nav.main{display:none;align-items:center;gap:.25rem}
@media(min-width:1024px){nav.main{display:flex}}
nav.main a{border-radius:.5rem;padding:.5rem .75rem;font-size:.875rem;font-weight:500;color:var(--mut);transition:.15s}
nav.main a:hover{background:var(--bg2);color:var(--txt)}
.hactions{display:flex;align-items:center;gap:.5rem}
.lang-pills{display:flex;align-items:center;gap:.125rem;border:1px solid var(--line);background:rgba(24,24,27,.8);border-radius:99px;padding:.125rem}
.lang-pills .li{margin-left:.25rem;color:var(--dim)}
.lang-pills button{border-radius:99px;padding:.25rem .625rem;font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
.lang-pills button.on{background:var(--amber);color:#09090b;box-shadow:0 2px 8px rgba(251,191,36,.3)}
.lang-pills button:not(.on):hover{color:var(--txt)}
.btn-star{display:none;align-items:center;gap:.5rem;border-radius:99px;background:var(--amber);padding:.5rem 1rem;font-size:.875rem;font-weight:600;color:#09090b;box-shadow:0 8px 20px rgba(251,191,36,.2);transition:.15s}
.btn-star:hover{background:var(--amber2)}
@media(min-width:640px){.btn-star{display:inline-flex}}
.burger{display:inline-flex;height:2.5rem;width:2.5rem;align-items:center;justify-content:center;border-radius:.5rem;border:1px solid var(--line);color:var(--txt2)}
@media(min-width:1024px){.burger{display:none}}
#mobileNav{display:none;border-top:1px solid var(--line-soft);background:rgba(9,9,11,.95);padding:.5rem 1rem 1rem}
#mobileNav.open{display:block}
#mobileNav a{display:block;border-radius:.5rem;padding:.625rem .75rem;font-weight:500;color:var(--txt2)}
#mobileNav a:hover{background:var(--bg2);color:var(--txt)}
#mobileNav .btn-star{display:flex;margin-top:.5rem;justify-content:center}

/* ===== Buttons ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border-radius:99px;padding:.75rem 1.75rem;font-weight:600;transition:.2s}
.btn-amber{background:var(--amber);color:#09090b;box-shadow:0 20px 40px rgba(251,191,36,.25)}
.btn-amber:hover{background:var(--amber2);transform:translateY(-2px)}
.btn-ghost{border:1px solid var(--line);background:rgba(24,24,27,.6);color:var(--txt)}
.btn-ghost:hover{border-color:rgba(251,191,36,.5);color:var(--amber2)}
.btn-link{padding:.5rem .75rem;font-size:.875rem;font-weight:500;color:var(--mut)}
.btn-link:hover{color:var(--amber2);text-decoration:underline;text-underline-offset:4px}

/* ===== Hero ===== */
.hero{position:relative;overflow:hidden}
.hero .bg{pointer-events:none;position:absolute;inset:0;background-image:radial-gradient(circle at 15% 20%,rgba(251,191,36,.08),transparent 42%),radial-gradient(circle at 85% 15%,rgba(45,212,191,.07),transparent 40%),radial-gradient(rgba(255,255,255,.055) 1px,transparent 1px);background-size:auto,auto,26px 26px}
.hero .in{position:relative;padding:3.5rem 0 4rem}
@media(min-width:640px){.hero .in{padding-top:5rem}}
@media(min-width:1024px){.hero .in{padding:6rem 0}}
.hero .center{max-width:48rem;margin:0 auto;text-align:center}
.badge{display:inline-flex;align-items:center;gap:.5rem;border-radius:99px;border:1px solid rgba(251,191,36,.25);background:var(--amber-soft);padding:.375rem 1rem;font-size:.8rem;font-weight:500;color:var(--amber2)}
@media(min-width:640px){.badge{font-size:.875rem}}
.badge .dot{position:relative;display:flex;height:.5rem;width:.5rem}
.badge .dot i{position:absolute;inset:0;border-radius:99px;background:var(--amber);opacity:.6;animation:ping 1.6s cubic-bezier(0,0,.2,1) infinite}
.badge .dot b{position:relative;height:.5rem;width:.5rem;border-radius:99px;background:var(--amber)}
@keyframes ping{75%,100%{transform:scale(2.2);opacity:0}}
h1{margin-top:1.5rem;font-size:2.25rem;font-weight:900;letter-spacing:-.03em;line-height:1.15;color:var(--txt)}
@media(min-width:640px){h1{font-size:3rem}}
@media(min-width:1024px){h1{font-size:3.75rem}}
h1 .acc{background:linear-gradient(90deg,var(--amber2),var(--orange),var(--amber));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .sub{margin:1.5rem auto 0;max-width:42rem;color:var(--mut);font-size:1.05rem}
@media(min-width:640px){.hero .sub{font-size:1.125rem}}
.ctas{margin-top:2rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.75rem}
@media(min-width:640px){.ctas{flex-direction:row;flex-wrap:wrap}}
.ctas .btn{width:100%}
@media(min-width:640px){.ctas .btn{width:auto}}
.chips{margin-top:1.75rem;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.5rem 1rem;font-size:.8rem;color:var(--dim)}
@media(min-width:640px){.chips{font-size:.875rem}}
.chips span{display:inline-flex;align-items:center;gap:.35rem}
.chips svg{color:rgba(251,191,36,.7)}
.hero-media{position:relative;max-width:64rem;margin:3rem auto 0}
@media(min-width:1024px){.hero-media{margin-top:4rem}}
.hero-media .glow{position:absolute;left:-1.5rem;right:-1.5rem;top:-2rem;bottom:2.5rem;z-index:-1;border-radius:2.5rem;background:linear-gradient(180deg,rgba(251,191,36,.1),transparent);filter:blur(2rem)}
.stats{max-width:64rem;margin:3rem auto 0;display:grid;grid-template-columns:repeat(2,1fr);gap:.75rem}
@media(min-width:640px){.stats{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1024px){.stats{grid-template-columns:repeat(5,1fr);gap:1rem}}
.stat{display:flex;flex-direction:column;border:1px solid var(--line);background:var(--card);border-radius:1rem;padding:1rem;text-align:center;transition:.2s}
.stat:hover{border-color:rgba(251,191,36,.3)}
.stat b{font-size:1.5rem;font-weight:800;letter-spacing:-.02em;color:var(--amber2)}
@media(min-width:640px){.stat b{font-size:1.875rem}}
.stat span{margin-top:.25rem;font-size:.75rem;color:var(--mut2);line-height:1.4}
.hero .downstream{margin-top:2.5rem;text-align:center;font-size:.875rem;color:var(--mut2)}
.hero .downstream a{display:inline-flex;align-items:center;gap:.25rem;font-weight:500;color:rgba(252,211,77,.9)}
.hero .downstream a:hover{color:var(--amber2)}

/* ===== Trust strip ===== */
.trust{border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);background:rgba(24,24,27,.3)}
.trust .in{display:flex;flex-direction:column;align-items:center;gap:1rem;padding:1.5rem 0}
@media(min-width:1024px){.trust .in{flex-direction:row;justify-content:space-between;gap:2rem}}
.trust .metrics{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.75rem 2rem}
.trust .metric{display:flex;align-items:center;gap:.625rem}
.trust .metric svg{color:var(--amber)}
.trust .metric b{font-size:1.125rem;font-weight:700}
.trust .metric span{font-size:.875rem;color:var(--mut2)}
.trust .badges{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.5rem}
.trust .pill{display:inline-flex;align-items:center;gap:.35rem;border-radius:99px;border:1px solid var(--line);background:rgba(24,24,27,.7);padding:.25rem .75rem;font-size:.75rem;font-weight:500;color:var(--txt2)}
.trust .pill svg{color:rgba(251,191,36,.8)}
.trust .pill.amber{border-color:rgba(251,191,36,.3);background:var(--amber-soft);font-weight:600;color:var(--amber2)}
.trust .pill.amber:hover{background:rgba(251,191,36,.2)}

/* ===== Media slots ===== */
.mslot{position:relative;width:100%;overflow:hidden;border:1px solid var(--line);background:var(--bg2);border-radius:1rem;box-shadow:0 25px 50px rgba(0,0,0,.4)}
.mslot .ph{position:relative;width:100%;aspect-ratio:16/9}
.mslot .ph img.poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s}
.mslot:hover .ph img.poster{transform:scale(1.02)}
.mslot .vig{pointer-events:none;position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.5),transparent,rgba(0,0,0,.2))}
.mslot .kind{position:absolute;left:1rem;top:1rem;display:inline-flex;align-items:center;gap:.35rem;border-radius:99px;border:1px solid rgba(251,191,36,.3);background:rgba(0,0,0,.6);padding:.25rem .75rem;font-size:.68rem;font-weight:600;letter-spacing:.12em;color:var(--amber2);backdrop-filter:blur(4px)}
.mslot .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.mslot .play i{position:relative;display:flex;height:4rem;width:4rem;align-items:center;justify-content:center;border-radius:99px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.55);color:#fff;backdrop-filter:blur(4px);transition:.2s}
@media(min-width:640px){.mslot .play i{height:5rem;width:5rem}}
.mslot:hover .play i{transform:scale(1.05);background:rgba(0,0,0,.7)}
.mslot .play i::before{content:'';position:absolute;inset:-1px;border-radius:99px;border:1px solid rgba(251,191,36,.4);animation:ping 2.4s cubic-bezier(0,0,.2,1) infinite}
.mslot .hint{position:absolute;bottom:.75rem;left:1rem;right:1rem;display:inline-flex;align-items:center;gap:.5rem;overflow:hidden;border-radius:.5rem;border:1px solid rgba(63,63,70,.7);background:rgba(0,0,0,.7);padding:.35rem .75rem;font-size:.72rem;color:var(--txt2);backdrop-filter:blur(4px)}
.mslot .hint svg{flex:none;color:var(--amber2)}
.mslot .hint code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mslot video,.mslot img.real{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mslot.s4-3 .ph{aspect-ratio:4/3}

/* ===== Cards / grids ===== */
.grid8{margin-top:2.5rem;display:grid;grid-template-columns:1fr;gap:1rem}
@media(min-width:640px){.grid8{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1024px){.grid8{grid-template-columns:repeat(4,1fr);gap:1.5rem}}
.card{border:1px solid var(--line);background:var(--card);border-radius:1rem;padding:1.25rem;transition:.2s}
@media(min-width:1024px){.card{padding:1.5rem}}
.card:hover{transform:translateY(-4px);border-color:rgba(251,191,36,.4);background:var(--card-solid)}
.card .ic{display:inline-flex;height:2.75rem;width:2.75rem;align-items:center;justify-content:center;border-radius:.75rem;border:1px solid rgba(251,191,36,.2);background:var(--amber-soft);font-size:1.25rem}
.card h3{margin-top:1rem;font-size:1rem;font-weight:600;color:var(--txt)}
@media(min-width:640px){.card h3{font-size:1.0625rem}}
.card p{margin-top:.5rem;font-size:.875rem;color:var(--mut);line-height:1.65}
.num{font-size:2.25rem;font-weight:900;line-height:1;color:#27272a}

/* ===== Steps ===== */
.steps-list{margin-top:2.5rem;display:grid;grid-template-columns:1fr;gap:1.25rem}
@media(min-width:768px){.steps-list{grid-template-columns:repeat(3,1fr)}}
.step{position:relative;border:1px solid var(--line);background:var(--card);border-radius:1rem;padding:1.5rem;transition:.2s}
.step:hover{border-color:rgba(251,191,36,.3)}
.step .top{display:flex;align-items:center;justify-content:space-between}
.step .ic{display:flex;height:2.75rem;width:2.75rem;align-items:center;justify-content:center;border-radius:.75rem;border:1px solid rgba(251,191,36,.3);background:var(--amber-soft);font-size:1.25rem}
.step h3{margin-top:1rem;font-size:1.125rem;font-weight:600}
.step p{margin-top:.5rem;font-size:.875rem;color:var(--mut)}
.terminal{max-width:48rem;margin:2rem auto 0;overflow:hidden;border:1px solid var(--line);background:#09090b;border-radius:1rem;box-shadow:0 20px 40px rgba(0,0,0,.3)}
.terminal .bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.75rem;border-bottom:1px solid var(--line);padding:.75rem 1.25rem}
.terminal .bar .t{display:flex;align-items:center;gap:.5rem;font-size:.875rem;font-weight:600;color:var(--txt2)}
.terminal .bar .t svg{color:var(--amber2)}
.copy-btn{display:inline-flex;align-items:center;gap:.375rem;border-radius:.5rem;border:1px solid var(--line);background:var(--bg2);padding:.375rem .75rem;font-size:.75rem;font-weight:600;color:var(--txt2);transition:.15s}
.copy-btn:hover{border-color:rgba(251,191,36,.5);color:var(--amber2)}
.copy-btn.ok{border-color:rgba(45,212,191,.5);color:var(--teal)}
.terminal pre{overflow-x:auto;padding:1rem 1.25rem;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.8125rem;line-height:1.7;color:var(--txt2)}
.terminal pre .dollar{margin-right:.75rem;color:rgba(251,191,36,.6);user-select:none}
.terminal pre span.l{display:block;white-space:pre}
.term-hint{margin-top:.75rem;text-align:center;font-size:.75rem;color:var(--mut2)}

/* ===== Dives ===== */
.dive{display:grid;grid-template-columns:1fr;align-items:center;gap:2rem}
@media(min-width:1024px){.dive{grid-template-columns:1fr 1fr;gap:3.5rem}}
.dive h2{margin-top:.5rem;font-size:1.5rem;font-weight:700;letter-spacing:-.02em;line-height:1.25}
@media(min-width:640px){.dive h2{font-size:1.875rem}}
@media(min-width:1024px){.dive h2{font-size:2.25rem}}
.dive .text{margin-top:1rem;color:var(--mut);line-height:1.7}
.dive ul{margin-top:1.5rem;display:flex;flex-direction:column;gap:.625rem}
.dive li{display:flex;align-items:flex-start;gap:.625rem;font-size:.875rem;color:var(--txt2)}
.dive li svg{flex:none;margin-top:.15rem;color:var(--teal)}
.dives-stack{display:flex;flex-direction:column;gap:4rem;padding:4rem 0}
@media(min-width:1024px){.dives-stack{gap:7rem}}
.flip .tdesc{order:2}
.flip .tmedia{order:1}
@media(min-width:1024px){.flip .tdesc{order:2}.flip .tmedia{order:1}}

/* ===== Use cases ===== */
.grid4{margin-top:2.5rem;display:grid;grid-template-columns:1fr;gap:1.25rem}
@media(min-width:640px){.grid4{grid-template-columns:repeat(2,1fr)}}
.ucase{display:flex;gap:1rem;border:1px solid var(--line);background:var(--card);border-radius:1rem;padding:1.5rem;transition:.2s}
.ucase:hover{border-color:rgba(251,191,36,.3);background:var(--card-solid)}
.ucase .ic{flex:none;display:flex;height:3rem;width:3rem;align-items:center;justify-content:center;border-radius:.75rem;border:1px solid rgba(251,191,36,.25);background:var(--amber-soft);font-size:1.35rem}
.ucase h3{font-size:1.125rem;font-weight:600}
.ucase p{margin-top:.375rem;font-size:.875rem;color:var(--mut);line-height:1.65}

/* ===== Gallery ===== */
.gal{margin-top:2.5rem;display:grid;grid-template-columns:1fr;gap:1.25rem}
@media(min-width:640px){.gal{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1024px){.gal{grid-template-columns:repeat(3,1fr);gap:1.5rem}}
.gal figure .shot{display:block;width:100%;text-align:left;cursor:zoom-in;border-radius:1rem}
.gal .frame{position:relative;overflow:hidden;border:1px solid var(--line);background:var(--bg2);border-radius:1rem;box-shadow:0 20px 40px rgba(0,0,0,.3);transition:.2s}
.gal figure:hover .frame{border-color:#3f3f46}
.gal figcaption{margin-top:.625rem;padding:0 .25rem;font-size:.875rem;color:var(--mut);transition:.15s}
.gal figure:hover figcaption{color:var(--txt2)}

/* ===== CTA band ===== */
.cta-band{position:relative;overflow:hidden;border:1px solid rgba(251,191,36,.3);border-radius:1.5rem;background:linear-gradient(135deg,rgba(251,191,36,.15),rgba(249,115,22,.1),#18181b);padding:2.5rem 1.5rem}
@media(min-width:640px){.cta-band{padding:2.5rem}}
@media(min-width:1024px){.cta-band{padding:3.5rem}}
.cta-band .dots{pointer-events:none;position:absolute;inset:0;opacity:.4;background-image:radial-gradient(rgba(251,191,36,.25) 1px,transparent 1px);background-size:22px 22px}
.cta-band .in{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:1.5rem}
@media(min-width:1024px){.cta-band .in{flex-direction:row;align-items:center;justify-content:space-between}}
.cta-band h2{font-size:1.5rem;font-weight:700;letter-spacing:-.02em}
@media(min-width:640px){.cta-band h2{font-size:1.875rem}}
.cta-band p{margin-top:.5rem;color:var(--txt2)}
.cta-band .acts{display:flex;width:100%;flex-direction:column;gap:.75rem}
@media(min-width:640px){.cta-band .acts{width:auto;flex-direction:row}}

/* ===== Tables (compare / matrix) ===== */
.tbl-wrap{margin-top:2.5rem;overflow-x:auto;border:1px solid var(--line);border-radius:1rem}
table.cmp{width:100%;min-width:680px;border-collapse:collapse;text-align:left}
table.cmp th,table.cmp td{padding:.875rem 1.25rem}
table.cmp thead tr{border-bottom:1px solid var(--line);background:var(--bg2)}
table.cmp thead th{font-size:.875rem;font-weight:600;color:var(--txt2);text-align:center}
table.cmp thead th:first-child{text-align:left}
table.cmp thead th.hl{background:rgba(251,191,36,.1);color:var(--amber2)}
table.cmp tbody tr{border-bottom:1px solid var(--line-soft)}
table.cmp tbody tr:last-child{border-bottom:0}
table.cmp tbody tr:nth-child(2n){background:rgba(24,24,27,.4)}
table.cmp tbody th{font-size:.875rem;font-weight:500;color:var(--txt2)}
table.cmp td{font-size:.875rem;text-align:center;white-space:nowrap}
table.cmp td.hl{background:rgba(251,191,36,.07);font-weight:500}
.cell-yes{display:inline-flex;align-items:center;gap:.35rem;font-weight:600;color:var(--amber2)}
.cell-no{color:var(--dim)}
.cell-part{display:inline-flex;align-items:center;gap:.35rem;color:var(--txt2)}
.cell-tag{display:inline-flex;align-items:center;border-radius:99px;border:1px solid #3f3f46;background:rgba(39,39,42,.7);padding:.125rem .625rem;font-size:.72rem;font-weight:500;color:var(--txt2)}
.tbl-note{margin-top:.75rem;font-size:.75rem;color:var(--mut2)}
.hotwrap{margin-top:2.5rem}
.hotwrap h3{font-size:1.125rem;font-weight:600;margin-bottom:1rem}
.hotkeys{display:flex;flex-wrap:wrap;gap:.5rem}
.hk{display:inline-flex;align-items:center;gap:.5rem;border-radius:.75rem;border:1px solid var(--line);background:var(--card);padding:.5rem .875rem;font-size:.75rem;color:var(--mut)}
.hk kbd{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.72rem;font-weight:600;color:var(--amber2);background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.2);border-radius:.375rem;padding:.1rem .4rem}

/* ===== Roadmap ===== */
.rm-list{position:relative;display:flex;flex-direction:column;gap:.75rem}
.rm{display:flex;align-items:center;gap:1rem;border:1px solid var(--line);background:var(--card);border-radius:.75rem;padding:1rem 1.25rem;transition:.2s}
.rm.prog{border-color:rgba(251,191,36,.4);background:rgba(251,191,36,.06);box-shadow:0 10px 20px rgba(251,191,36,.05)}
.rm .mid{flex:none;display:flex;height:2.25rem;width:3.5rem;align-items:center;justify-content:center;border-radius:.5rem;border:1px solid #3f3f46;background:#27272a;font-size:.72rem;font-weight:700;letter-spacing:.06em;color:var(--mut)}
.rm.prog .mid{border-color:rgba(251,191,36,.5);background:rgba(251,191,36,.15);color:var(--amber2)}
.rm .ttl{flex:1;font-size:.875rem;font-weight:500;color:var(--txt)}
@media(min-width:640px){.rm .ttl{font-size:1rem}}
.rm .st{display:inline-flex;align-items:center;gap:.35rem;font-size:.72rem;font-weight:600;color:rgba(252,211,77,.9);white-space:nowrap}
.rm .st.prog{color:var(--amber2)}
.rm .st.prog svg{animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.4}}
.rm .n{color:var(--dim);font-size:.72rem}
@media(max-width:767px){.rm .n{display:none}}

/* ===== Quotes ===== */
.qgrid{margin-top:2.5rem;display:grid;grid-template-columns:1fr;gap:1.25rem}
@media(min-width:768px){.qgrid{grid-template-columns:repeat(3,1fr)}}
.qslot{display:flex;flex-direction:column;align-items:flex-start;gap:1rem;border:1px dashed #3f3f46;background:rgba(24,24,27,.2);border-radius:1rem;padding:1.5rem}
.qslot .ic{display:flex;height:2.5rem;width:2.5rem;align-items:center;justify-content:center;border-radius:.75rem;border:1px solid #3f3f46;color:var(--mut);font-size:1.1rem}
.qslot blockquote{font-size:.875rem;font-style:italic;color:var(--mut2);line-height:1.7}
.qslot figcaption{margin-top:auto;font-size:.72rem;font-weight:500;text-transform:uppercase;letter-spacing:.08em;color:var(--dim)}
.qcard{display:flex;flex-direction:column;border:1px solid var(--line);background:var(--card);border-radius:1rem;padding:1.5rem}
.qcard blockquote{flex:1;font-size:.875rem;color:var(--txt2);line-height:1.7}
.qcard .who{margin-top:1rem;display:flex;align-items:center;gap:.75rem}
.qcard .ava{display:flex;height:2.25rem;width:2.25rem;align-items:center;justify-content:center;border-radius:99px;background:linear-gradient(135deg,var(--amber),var(--orange));font-size:.8rem;font-weight:700;color:#09090b}
.qcard .who b{display:block;font-size:.875rem;font-weight:600}
.qcard .who span{display:block;font-size:.72rem;color:var(--mut2)}
.qcard .who a:hover{color:var(--amber2)}

/* ===== FAQ ===== */
.faq-grid{display:grid;grid-template-columns:1fr;gap:2.5rem}
@media(min-width:1024px){.faq-grid{grid-template-columns:1fr 2fr;gap:3.5rem}}
.faq-list{border-top:1px solid var(--line)}
.faq-item{border-bottom:1px solid var(--line)}
.faq-item summary{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1.25rem 0;cursor:pointer;list-style:none;font-size:1rem;font-weight:600;color:var(--txt);transition:.15s}
@media(min-width:640px){.faq-item summary{font-size:1.0625rem}}
.faq-item summary::-webkit-details-marker{display:none}
.faq-item summary:hover,.faq-item[open] summary{color:var(--amber2)}
.faq-item summary .chev{flex:none;transition:transform .2s;color:var(--mut)}
.faq-item[open] summary .chev{transform:rotate(180deg)}
.faq-item .ans{padding:0 0 1.25rem;font-size:.875rem;color:var(--mut);line-height:1.7}
@media(min-width:640px){.faq-item .ans{font-size:.9375rem}}

/* ===== Community ===== */
#community{border-top:1px solid var(--line-soft);background:rgba(24,24,27,.3)}
.plat-grid{margin-top:2.5rem;display:grid;grid-template-columns:1fr;gap:1rem}
@media(min-width:640px){.plat-grid{grid-template-columns:repeat(2,1fr)}}
.plat{display:flex;align-items:center;gap:1rem;border:1px solid var(--line);background:var(--card);border-radius:1rem;padding:1.25rem;transition:.2s}
@media(min-width:1024px){.plat{padding:1.5rem}}
.plat:hover{transform:translateY(-4px);border-color:#3f3f46}
.plat.primary{border-color:rgba(251,191,36,.5);background:linear-gradient(135deg,rgba(251,191,36,.15),rgba(249,115,22,.05));box-shadow:0 10px 30px rgba(251,191,36,.1)}
.plat.primary:hover{box-shadow:0 15px 40px rgba(251,191,36,.2);border-color:rgba(251,191,36,.5)}
.plat .ic{flex:none;display:flex;height:3rem;width:3rem;align-items:center;justify-content:center;border-radius:.75rem;border:1px solid #3f3f46;background:#27272a;font-size:1.3rem;transition:.15s}
.plat:hover .ic{color:var(--amber2)}
.plat.primary .ic{border-color:rgba(251,191,36,.4);background:rgba(251,191,36,.15)}
.plat .mid{flex:1;min-width:0}
.plat .nm{display:flex;align-items:center;gap:.5rem;font-size:1rem;font-weight:600}
@media(min-width:640px){.plat .nm{font-size:1.0625rem}}
.plat .nm .star{display:none;border-radius:99px;background:var(--amber);padding:.05rem .5rem;font-size:.625rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#09090b}
@media(min-width:640px){.plat .nm .star{display:inline}}
.plat .role{margin-top:.125rem;font-size:.875rem;color:var(--mut);line-height:1.45}
.plat .arr{flex:none;color:var(--dim);transition:.2s}
.plat:hover .arr{color:var(--amber2);transform:translate(.125rem,-.125rem)}
.donate{margin-top:2rem;display:flex;flex-direction:column;align-items:flex-start;gap:1rem;border:1px solid rgba(251,113,133,.25);border-radius:1rem;background:linear-gradient(90deg,rgba(244,63,94,.1),transparent);padding:1.5rem}
@media(min-width:640px){.donate{flex-direction:row;align-items:center;padding:2rem}}
.donate .ic{flex:none;display:flex;height:3rem;width:3rem;align-items:center;justify-content:center;border-radius:.75rem;background:rgba(251,113,133,.15);color:var(--rose);font-size:1.3rem}
.donate h3{font-size:1.125rem;font-weight:600}
.donate p{margin-top:.25rem;font-size:.875rem;color:var(--mut)}
.donate .acts{display:flex;flex-wrap:wrap;gap:.625rem}
.donate .acts a{display:inline-flex;align-items:center;gap:.5rem;border-radius:99px;background:var(--rose);padding:.625rem 1.25rem;font-size:.875rem;font-weight:600;color:#09090b;box-shadow:0 10px 20px rgba(244,63,94,.2);transition:.2s}
.donate .acts a:hover{background:#fda4af;transform:translateY(-2px)}

/* ===== Final CTA ===== */
#final-cta{position:relative;overflow:hidden;border-top:1px solid var(--line-soft)}
#final-cta .bg{pointer-events:none;position:absolute;inset:0;background-image:radial-gradient(circle at 50% 0%,rgba(251,191,36,.14),transparent 55%),radial-gradient(rgba(255,255,255,.05) 1px,transparent 1px);background-size:auto,24px 24px}
#final-cta .in{position:relative;max-width:56rem;margin:0 auto;padding:5rem 1rem;text-align:center}
@media(min-width:1024px){#final-cta .in{padding:7rem 1rem}}
#final-cta h2{font-size:1.875rem;font-weight:900;letter-spacing:-.03em}
@media(min-width:640px){#final-cta h2{font-size:3rem}}
#final-cta p{margin:1rem auto 0;max-width:36rem;color:var(--mut)}
#final-cta .acts{margin-top:2rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.75rem}
@media(min-width:640px){#final-cta .acts{flex-direction:row}}
#final-cta .acts .btn{width:100%}
@media(min-width:640px){#final-cta .acts .btn{width:auto}}
#final-cta .support{margin-top:1.5rem;font-size:.875rem;color:var(--mut2)}
#final-cta .support a{display:inline-flex;align-items:center;gap:.25rem;font-weight:600;color:rgba(251,113,133,.9)}
#final-cta .support a:hover{color:var(--rose)}

/* ===== Footer ===== */
footer.site{margin-top:auto;border-top:1px solid var(--line-soft);background:var(--bg);padding-bottom:env(safe-area-inset-bottom)}
.fgrid{display:grid;grid-template-columns:1fr;gap:2.5rem;padding:3rem 0}
@media(min-width:640px){.fgrid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1024px){.fgrid{grid-template-columns:repeat(4,1fr)}}
.fgrid .brand{grid-column:span 1}
@media(min-width:640px){.fgrid .brand{grid-column:span 2}}
footer.site p.tag{margin-top:.75rem;max-width:24rem;font-size:.875rem;color:var(--mut)}
footer.site p.built{margin-top:.5rem;font-size:.72rem;color:var(--dim)}
footer.site h3{font-size:.875rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--txt2)}
footer.site ul.col{margin-top:.75rem;display:flex;flex-direction:column;gap:.5rem}
footer.site ul.col a{font-size:.875rem;color:var(--mut)}
footer.site ul.col a:hover{color:var(--amber2)}
.fplat{margin-top:1.25rem;display:flex;flex-wrap:wrap;gap:.5rem}
.fplat a{display:flex;height:2.25rem;width:2.25rem;align-items:center;justify-content:center;border-radius:.5rem;border:1px solid var(--line);background:var(--bg2);font-size:1rem;transition:.15s}
.fplat a:hover{border-color:rgba(251,191,36,.5)}
.fbottom{display:flex;flex-direction:column;gap:.75rem;border-top:1px solid var(--line-soft);padding:1.5rem 0;font-size:.72rem;color:var(--mut2)}
@media(min-width:640px){.fbottom{flex-direction:row;align-items:center;justify-content:space-between}}
.fbottom a{color:var(--mut2)}
.fbottom a:hover{color:var(--txt2);text-decoration:underline;text-underline-offset:2px}
.fbottom .disc{max-width:42rem;line-height:1.6}

/* ===== Sticky mobile CTA ===== */
#stickyCta{position:fixed;inset-inline:0;bottom:0;z-index:40;border-top:1px solid var(--line);background:rgba(9,9,11,.95);backdrop-filter:blur(12px);transform:translateY(100%);transition:transform .3s ease;pointer-events:none}
#stickyCta.show{transform:translateY(0);pointer-events:auto}
#stickyCta .in{max-width:48rem;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:.625rem;padding:.75rem 1rem max(.75rem,env(safe-area-inset-bottom))}
#stickyCta a{display:inline-flex;min-height:44px;align-items:center;justify-content:center;gap:.5rem;border-radius:.75rem;padding:0 1rem;font-size:.875rem;font-weight:600}
#stickyCta .a1{background:var(--amber);color:#09090b;box-shadow:0 10px 20px rgba(251,191,36,.2)}
#stickyCta .a2{border:1px solid #3f3f46;background:#18181b;color:var(--txt)}
@media(min-width:1024px){#stickyCta{display:none}}

/* ===== Lightbox ===== */
#lightbox{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.85);backdrop-filter:blur(6px);padding:1rem}
#lightbox.open{display:flex}
#lightbox .box{max-width:56rem;width:100%}
#lightbox .ttl{padding:.25rem .25rem .5rem;font-size:.9375rem;font-weight:600;color:var(--txt)}
#lightbox .img{overflow:hidden;border:1px solid var(--line);border-radius:.75rem}
#lightbox img{width:100%;aspect-ratio:4/3;object-fit:cover}
#lightbox .path{padding:.5rem .25rem 0;font-family:ui-monospace,Menlo,monospace;font-size:.68rem;color:var(--mut2)}
#lightbox .close{position:absolute;top:1rem;right:1rem;display:flex;height:2.5rem;width:2.5rem;align-items:center;justify-content:center;border-radius:.75rem;border:1px solid #3f3f46;background:#18181b;color:var(--txt)}
</style>
</head>

    chev: '<path d="m6 9 6 6 6-6"/>'

};

/* ===== Язык: ?lang → localStorage → браузер → en ===== */
let LANG = (() => {
  const q = new URLSearchParams(location.search).get('lang');
  if (q === 'ru' || q === 'en') return q;
  const s = localStorage.getItem(LANG_KEY);
  if (s === 'ru' || s === 'en') return s;
  return (navigator.language || 'en').toLowerCase().startsWith('ru') ? 'ru' : 'en';
})();

const $ = sel => document.querySelector(sel);
const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const NAV_IDS = ['features', 'demo', 'steps', 'widgets', 'ai', 'faq', 'community'];

/* Медиа-слот: постер + бейдж типа + play + подсказка; при src — реальное видео/картинка */
function mediaSlot(cfg, key, kind, title, hint) {
  const m = cfg.media[key] || {};
  const src = m.src || '';
  const kindLabel = kind === 'video' ? (LANG === 'ru' ? 'ВИДЕО' : 'VIDEO') : kind.toUpperCase();
  const overlay = src ? '' : `
    <span class="kind">${kind === 'video' ? I('play', 12) : I('image', 12)} ${kindLabel}</span>
    ${kind !== 'screenshot' ? `<span class="play"><i>${I('play', 28)}</i></span>` : ''}
    <span class="hint">${I('folder', 14)}<code>${esc(hint)}</code></span>`;
  const real = !src ? '' : /\.(mp4|webm|ogg|mov)(\?|$)/i.test(src)
    ? `<video src="${esc(src)}" poster="${esc(m.poster)}" controls preload="metadata"></video>`
    : `<img class="real" src="${esc(src)}" alt="${esc(title)}" loading="lazy">`;
  return `<figure class="mslot">
    <div class="ph">
      <img class="poster" src="${esc(m.poster)}" alt="${esc(title)}">
      <div class="vig" aria-hidden="true"></div>
      ${overlay}${real}
    </div>
    <figcaption class="sr-only">${esc(title)}</figcaption>
  </figure>`;
}

/* ===== Trust metrics: живые цифры GitHub (мягкая деградация) ===== */
function renderTrustMetrics(stats) {
  const el = $('#trustMetrics');
  if (!el) return;
  if (!stats) { el.innerHTML = ''; return; }
  const fmt = n => new Intl.NumberFormat(LANG === 'ru' ? 'ru-RU' : 'en-US').format(n);
  let days = null;
  if (stats.pushedAt) days = Math.floor((Date.now() - new Date(stats.pushedAt).getTime()) / 864e5);
  const commitLabel = days === null ? '' : (days < 1 ? t(CFG.trust.today, LANG) : new Intl.RelativeTimeFormat(LANG === 'ru' ? 'ru-RU' : 'en-US', { numeric: 'auto' }).format(-days, 'day'));
  el.innerHTML = `
    <div class="metric">${I('starFill', 20)}<b>${fmt(stats.stars)}</b><span>${t(CFG.trust.stars, LANG)}</span></div>
    <div class="metric">${I('fork', 20)}<b>${fmt(stats.forks)}</b><span>${t(CFG.trust.forks, LANG)}</span></div>
    ${commitLabel ? `<div class="metric">${I('clock', 20)}<b>${esc(commitLabel)}</b><span>${t(CFG.trust.commit, LANG)}</span></div>` : ''}`;
}

async function fetchRepoStats() {
  const KEY = 'cd_repo_stats';
  try {
    const c = JSON.parse(sessionStorage.getItem(KEY) || 'null');
    if (c && Date.now() - c.at < 36e5) return c.data;
  } catch (e) { /* ignore */ }
  try {
    const ctrl = new AbortController();
    const to = setTimeout(() => ctrl.abort(), 3500);
    const r = await fetch('https://api.github.com/repos/danku13/CanvasDesk', { headers: { Accept: 'application/vnd.github+json' }, signal: ctrl.signal });
    clearTimeout(to);
    if (!r.ok) return null;
    const j = await r.json();
    const data = { stars: j.stargazers_count || 0, forks: j.forks_count || 0, pushedAt: j.pushed_at };
    try { sessionStorage.setItem(KEY, JSON.stringify({ at: Date.now(), data })); } catch (e) { /* ignore */ }
    return data;
  } catch (e) { return null; }
}

/* ===== Взаимодействия ===== */
document.addEventListener('click', e => {
  const langBtn = e.target.closest('[data-lang]');
  if (langBtn) { LANG = langBtn.dataset.lang; localStorage.setItem(LANG_KEY, LANG); render(CFG); fetchRepoStats().then(renderTrustMetrics); return; }
  const lbBtn = e.target.closest('[data-lb]');
  if (lbBtn) {
    const g = CFG.gallery.items[+lbBtn.dataset.lb];
    $('#lbTitle').textContent = t(g.title, LANG);
    $('#lbImg').src = g.src || g.poster || g.hint;
    $('#lbImg').alt = t(g.title, LANG);
    $('#lbPath').textContent = g.src || g.hint;
    $('#lightbox').classList.add('open');
    return;
  }
  if (e.target.closest('#lbClose') || e.target.id === 'lightbox') $('#lightbox').classList.remove('open');
  const cp = e.target.closest('#copyBtn');
  if (cp) {
    const txt = cp.dataset.cmd;
    const done = ok => { cp.classList.toggle('ok', ok); cp.querySelector('span').textContent = t(ok ? CFG.steps.copied : CFG.steps.copy, LANG); setTimeout(() => { cp.classList.remove('ok'); cp.querySelector('span').textContent = t(CFG.steps.copy, LANG); }, 1800); };
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(() => done(true), () => done(false));
    else { const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(true); } catch (err) { done(false); } ta.remove(); }
  }
  const b = e.target.closest('#burger');
  if (b) { const nav = $('#mobileNav'); const open = nav.classList.toggle('open'); b.setAttribute('aria-expanded', String(open)); b.firstElementChild.innerHTML = open ? I('x', 20) : I('menu', 20); }
  if (e.target.closest('#mobileNav a')) { $('#mobileNav').classList.remove('open'); $('#burger').firstElementChild.innerHTML = I('menu', 20); $('#burger').setAttribute('aria-expanded', 'false'); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#lightbox').classList.remove('open'); });

/* Sticky mobile CTA: после первого экрана, скрыт у финального CTA и в футере */
(function () {
  const bar = $('#stickyCta');
  let pastHero = false, nearEnd = false;
  let ctaVisible = false, footVisible = false;
  const update = () => {
    nearEnd = ctaVisible || footVisible;
    const v = pastHero && !nearEnd;
    bar.classList.toggle('show', v);
    bar.setAttribute('aria-hidden', String(!v));
    bar.querySelectorAll('a').forEach(a => a.tabIndex = v ? 0 : -1);
  };
  addEventListener('scroll', () => { pastHero = scrollY > innerHeight * 0.9; update(); }, { passive: true });
  new IntersectionObserver(es => { ctaVisible = es[0].isIntersecting; update(); }, { threshold: 0.05 }).observe($('#final-cta'));
  new IntersectionObserver(es => { footVisible = es[0].isIntersecting; update(); }, { threshold: 0.05 }).observe($('footer.site'));
})();

/* ===== Запуск ===== */
let CFG;
(async () => {
  CFG = await loadConfigAsync();
  render(CFG);
  const stats = await fetchRepoStats();
  if (stats) renderTrustMetrics(stats);
})();
</script>
