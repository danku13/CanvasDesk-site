<style>
/* ============================================================
   CanvasDesk v4 — dual-theme design system
   · dark  → retrowave / neonwave (Unbounded, sun-grid, neon glow)
   · light → typography / editorial (Playfair Display, ink & paper)
   ============================================================ */

/* ===== Design tokens ===== */
:root{
  --font-b:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-m:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
[data-theme="dark"]{
  --bg:#0a0118;--bg2:#150a2e;--tint:rgba(124,58,237,.07);
  --card:rgba(24,10,52,.5);--card-solid:#170b33;
  --line:#31205f;--line-soft:rgba(139,92,246,.22);
  --txt:#f4efff;--txt2:#ddd1fa;--mut:#a795d6;--mut2:#7f6cb4;--dim:#5a4889;
  --acc:#ff2ec4;--acc2:#00e5ff;--acc3:#8b5cf6;
  --teal:#00e5ff;--rose:#ff5c8a;
  --acc-soft:rgba(255,46,196,.08);
  --dot-c:rgba(255,255,255,.05);
  --head-bg:rgba(10,1,24,.82);
  --ann-bg:linear-gradient(90deg,#ff2ec4,#7c3aed 55%,#0090c8);
  --ann-fg:#ffffff;
  --btn-bg:linear-gradient(135deg,#ff2ec4,#7c3aed);
  --btn-fg:#ffffff;
  --btn-glow:0 0 26px rgba(255,46,196,.4),0 12px 32px rgba(124,58,237,.28);
  --pill-on-bg:#ff2ec4;--pill-on-fg:#fff;
  --term-bg:#05010e;--term-fg:#ddd1fa;
  --num-c:#00e5ff;
  --r-card:16px;--r-pill:99px;--r-btn:99px;
  --font-d:'Unbounded',system-ui,sans-serif;
  --fs-h1:clamp(1.85rem,1.35rem+2.2vw,2.9rem);
  --fs-h2:clamp(1.4rem,1.2rem+1vw,1.9rem);
  --h1-lh:1.25;
}
[data-theme="light"]{
  --bg:#faf7f1;--bg2:#f1ebdf;--tint:#f1ebdf;
  --card:#fffdf9;--card-solid:#ffffff;
  --line:#e0d8c8;--line-soft:rgba(30,26,20,.14);
  --txt:#1e1a14;--txt2:#403a30;--mut:#6f675a;--mut2:#918878;--dim:#b5ab97;
  --acc:#c2410c;--acc2:#1e1a14;--acc3:#a16207;
  --teal:#a16207;--rose:#b3372c;
  --acc-soft:rgba(194,65,12,.06);
  --dot-c:rgba(30,26,20,.07);
  --head-bg:rgba(250,247,241,.86);
  --ann-bg:#1e1a14;--ann-fg:#faf7f1;
  --btn-bg:#1e1a14;--btn-fg:#faf7f1;
  --btn-glow:none;
  --pill-on-bg:#1e1a14;--pill-on-fg:#faf7f1;
  --term-bg:#211c15;--term-fg:#efe9dc;
  --num-c:#1e1a14;
  --r-card:10px;--r-pill:8px;--r-btn:8px;
  --font-d:'Playfair Display',Georgia,'Times New Roman',serif;
  --fs-h1:clamp(2.35rem,1.8rem+2.6vw,4rem);
  --fs-h2:clamp(1.8rem,1.45rem+1.5vw,2.45rem);
  --h1-lh:1.08;
}

/* ===== Base ===== */
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{overflow-x:clip}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{background:var(--bg);color:var(--txt);font:16px/1.6 var(--font-b);-webkit-font-smoothing:antialiased}
img,svg{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
.wrap{max-width:80rem;margin:0 auto;padding:0 1rem}
@media(min-width:640px){.wrap{padding:0 1.5rem}}
@media(min-width:1024px){.wrap{padding:0 2rem}}
section{scroll-margin-top:5rem}
.sec-pad{padding:4rem 0}
@media(min-width:1024px){.sec-pad{padding:6rem 0}}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.tint{background:var(--tint)}

/* Typography helpers */
.kicker{font-size:.8rem;font-weight:600;text-transform:uppercase;letter-spacing:.16em;color:var(--acc2)}
h2.sec-title{margin-top:.625rem;font-family:var(--font-d);font-size:var(--fs-h2);font-weight:700;letter-spacing:-.01em;color:var(--txt);line-height:1.15}
.sec-sub{margin-top:1rem;color:var(--mut);line-height:1.65;max-width:42rem}
.sec-head{max-width:44rem}

h1{font-family:var(--font-d);font-size:var(--fs-h1);font-weight:800;letter-spacing:-.02em;line-height:var(--h1-lh);color:var(--txt)}

/* ===== Announcement bar ===== */
#announcement{background:var(--ann-bg);color:var(--ann-fg)}
#announcement .in{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.35rem .75rem;padding:.5rem 1rem;text-align:center;font-size:.8rem;font-weight:500}
@media(min-width:640px){#announcement .in{font-size:.875rem}}
#announcement .cta{display:inline-flex;align-items:center;gap:.25rem;border-radius:99px;background:rgba(255,255,255,.14);padding:.125rem .625rem;font-weight:600}
#announcement .cta:hover{background:rgba(255,255,255,.24);text-decoration:underline}

/* ===== Header ===== */
header.site{position:sticky;top:0;z-index:50;border-bottom:1px solid var(--line-soft);background:var(--head-bg);backdrop-filter:blur(12px)}
.hrow{display:flex;height:4rem;align-items:center;justify-content:space-between;gap:1rem}
.logo{display:flex;align-items:center;gap:.625rem}
.logo .mark{display:flex;height:2.25rem;width:2.25rem;align-items:center;justify-content:center;border-radius:.75rem;background:var(--btn-bg);color:var(--btn-fg);box-shadow:var(--btn-glow)}
.logo .name{font-size:1.125rem;font-weight:700;letter-spacing:-.02em}
.logo .name b{color:var(--acc);font-weight:700}
nav.main{display:none;align-items:center;gap:.25rem}
@media(min-width:1024px){nav.main{display:flex}}
nav.main a{border-radius:.5rem;padding:.5rem .75rem;font-size:.875rem;font-weight:500;color:var(--mut);transition:.15s}
nav.main a:hover{background:var(--bg2);color:var(--txt)}
.hactions{display:flex;align-items:center;gap:.5rem}
.lang-pills{display:flex;align-items:center;gap:.125rem;border:1px solid var(--line);border-radius:var(--r-pill);padding:.125rem}
.lang-pills .li{margin-left:.25rem;color:var(--dim);display:inline-flex}
.lang-pills button{border-radius:var(--r-pill);padding:.25rem .625rem;font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
.lang-pills button.on{background:var(--pill-on-bg);color:var(--pill-on-fg)}
.lang-pills button:not(.on):hover{color:var(--txt)}
.tbtn{display:inline-flex;height:2.5rem;width:2.5rem;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:var(--r-pill);color:var(--txt2);transition:.15s}
.tbtn:hover{color:var(--acc);border-color:var(--acc)}
.tbtn .imoon{display:none}
[data-theme="light"] .tbtn .isun{display:none}
[data-theme="light"] .tbtn .imoon{display:inline-flex}
.btn-star{display:none;align-items:center;gap:.5rem;border-radius:var(--r-btn);background:var(--btn-bg);padding:.5rem 1rem;font-size:.875rem;font-weight:600;color:var(--btn-fg);box-shadow:var(--btn-glow);transition:.15s}
.btn-star:hover{filter:brightness(1.12)}
@media(min-width:640px){.btn-star{display:inline-flex}}
.burger{display:inline-flex;height:2.5rem;width:2.5rem;align-items:center;justify-content:center;border-radius:.5rem;border:1px solid var(--line);color:var(--txt2)}
.burger svg{margin:auto}
@media(min-width:1024px){.burger{display:none}}
#mobileNav{display:none;border-top:1px solid var(--line-soft);background:var(--head-bg);padding:.5rem 1rem 1rem}
#mobileNav.open{display:block}
#mobileNav a{display:block;border-radius:.5rem;padding:.625rem .75rem;font-weight:500;color:var(--txt2)}
#mobileNav a:hover{background:var(--bg2);color:var(--txt)}
#mobileNav .btn-star{display:flex;margin-top:.5rem;justify-content:center}

/* ===== Buttons ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border-radius:var(--r-btn);padding:.75rem 1.6rem;font-weight:600;transition:.2s}
.btn-amber{background:var(--btn-bg);color:var(--btn-fg);box-shadow:var(--btn-glow)}
.btn-amber:hover{filter:brightness(1.12);transform:translateY(-2px)}
.btn-ghost{border:1px solid var(--line);background:transparent;color:var(--txt)}
.btn-ghost:hover{border-color:var(--acc);color:var(--acc)}
.btn-link{padding:.5rem .75rem;font-size:.875rem;font-weight:500;color:var(--mut)}
.btn-link:hover{color:var(--acc);text-decoration:underline;text-underline-offset:4px}

/* ===== Hero ===== */
.hero{position:relative;overflow:hidden}
.hero .bg{pointer-events:none;position:absolute;inset:0;background-image:radial-gradient(var(--dot-c) 1px,transparent 1px);background-size:26px 26px}
.hero .in{position:relative;padding:3.5rem 0 4rem}
@media(min-width:640px){.hero .in{padding-top:5rem}}
@media(min-width:1024px){.hero .in{padding:6rem 0}}
.hero .center{max-width:48rem;margin:0 auto;text-align:center}
.badge{display:inline-flex;align-items:center;gap:.5rem;border-radius:var(--r-pill);border:1px solid var(--line);padding:.375rem 1rem;font-size:.8rem;font-weight:500;color:var(--txt2)}
@media(min-width:640px){.badge{font-size:.875rem}}
.badge .dot{position:relative;display:flex;height:.5rem;width:.5rem}
.badge .dot i{position:absolute;inset:0;border-radius:99px;background:var(--acc);opacity:.6;animation:ping 1.6s cubic-bezier(0,0,.2,1) infinite}
.badge .dot b{position:relative;height:.5rem;width:.5rem;border-radius:99px;background:var(--acc)}
@keyframes ping{75%,100%{transform:scale(2.2);opacity:0}}
h1{margin-top:1.5rem}
h1 .acc{color:var(--acc);font-style:italic}
.hero .sub{margin:1.375rem auto 0;max-width:40rem;color:var(--mut);font-size:1.05rem}
@media(min-width:640px){.hero .sub{font-size:1.125rem}}
.hero .who{margin-top:1.5rem;display:flex;flex-wrap:wrap;justify-content:center;gap:.375rem .5rem}
.hero .who a{display:inline-flex;align-items:center;gap:.3rem;border:1px solid var(--line);border-radius:var(--r-pill);padding:.3rem .8rem;font-size:.8rem;font-weight:500;color:var(--txt2);transition:.15s}
.hero .who a:hover{border-color:var(--acc);color:var(--acc)}
.ctas{margin-top:1.75rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.75rem}
@media(min-width:640px){.ctas{flex-direction:row;flex-wrap:wrap}}
.ctas .btn{width:100%}
@media(min-width:640px){.ctas .btn{width:auto}}
.chips{margin-top:1.5rem;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.5rem 1rem;font-size:.8rem;color:var(--dim);list-style:none}
@media(min-width:640px){.chips{font-size:.875rem}}
.chips span{display:inline-flex;align-items:center;gap:.35rem}
.chips svg{color:var(--acc2);opacity:.8}
.hero-media{position:relative;max-width:64rem;margin:3rem auto 0}
@media(min-width:1024px){.hero-media{margin-top:4rem}}
.hero-media .glow{position:absolute;left:-1.5rem;right:-1.5rem;top:-2rem;bottom:2.5rem;z-index:-1;border-radius:2.5rem;background:var(--acc-soft);filter:blur(2rem)}
.stats{max-width:64rem;margin:3rem auto 0;display:grid;grid-template-columns:repeat(2,1fr);gap:.75rem}
@media(min-width:640px){.stats{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1024px){.stats{grid-template-columns:repeat(5,1fr);gap:1rem}}
.stat{display:flex;flex-direction:column;border:1px solid var(--line);background:var(--card);border-radius:var(--r-card);padding:1rem;text-align:center;transition:.2s}
.stat:hover{border-color:var(--acc)}
.stat b{font-family:var(--font-d);font-size:1.5rem;font-weight:700;letter-spacing:-.01em;color:var(--num-c)}
@media(min-width:640px){.stat b{font-size:1.75rem}}
.stat span{margin-top:.25rem;font-size:.75rem;color:var(--mut2);line-height:1.4}
.hero .downstream{margin-top:2.5rem;text-align:center;font-size:.875rem;color:var(--mut2)}
.hero .downstream a{display:inline-flex;align-items:center;gap:.25rem;font-weight:500;color:var(--acc)}
.hero .downstream a:hover{color:var(--acc2)}

/* ===== Personas — «зачем мне это» ===== */
.pgrid{margin-top:2.5rem;display:grid;grid-template-columns:1fr;gap:1rem}
@media(min-width:640px){.pgrid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1024px){.pgrid{grid-template-columns:repeat(4,1fr);gap:1.25rem}}
.pcard{display:flex;flex-direction:column;border:1px solid var(--line);background:var(--card);border-radius:var(--r-card);padding:1.5rem;transition:.2s;scroll-margin-top:6rem}
.pcard:hover{transform:translateY(-4px);border-color:var(--acc)}
.pcard .ptop{display:flex;align-items:center;justify-content:space-between}
.pcard .pnum{font-family:var(--font-d);font-size:1.375rem;font-weight:700;line-height:1;color:var(--dim)}
.pcard .pic{font-size:1.5rem}
.pcard h3{margin-top:.875rem;font-size:1rem;font-weight:600;color:var(--txt)}
.pcard .pgoal{margin-top:.5rem;font-family:var(--font-d);font-size:1.1rem;line-height:1.35;color:var(--txt)}
.pcard .pproof{margin-top:.5rem;font-size:.85rem;color:var(--mut);line-height:1.6}
.pcard .plink{margin-top:auto;padding-top:1.125rem;display:inline-flex;align-items:center;gap:.375rem;font-size:.875rem;font-weight:600;color:var(--acc)}
.pcard .plink:hover{text-decoration:underline;text-underline-offset:4px}

/* ===== Trust strip ===== */
.trust{border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft)}
.trust .in{display:flex;flex-direction:column;align-items:center;gap:1rem;padding:1.5rem 0}
@media(min-width:1024px){.trust .in{flex-direction:row;justify-content:space-between;gap:2rem}}
.trust .metrics{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.75rem 2rem}
.trust .metric{display:flex;align-items:center;gap:.625rem}
.trust .metric svg{color:var(--acc)}
.trust .metric b{font-size:1.125rem;font-weight:700}
.trust .metric span{font-size:.875rem;color:var(--mut2)}
.trust .badges{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.5rem;list-style:none}
.trust .pill{display:inline-flex;align-items:center;gap:.35rem;border-radius:var(--r-pill);border:1px solid var(--line);padding:.25rem .75rem;font-size:.75rem;font-weight:500;color:var(--txt2)}
.trust .pill svg{color:var(--acc2);opacity:.8}
.trust .pill.amber{border-color:var(--acc);background:var(--acc-soft);font-weight:600;color:var(--acc)}
.trust .pill.amber:hover{filter:brightness(1.1)}

/* ===== Media slots ===== */
.mslot{position:relative;width:100%;overflow:hidden;border:1px solid var(--line);background:var(--bg2);border-radius:var(--r-card);box-shadow:0 25px 50px rgba(0,0,0,.18)}
.mslot .ph{position:relative;width:100%;aspect-ratio:16/9}
.mslot .ph img.poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s}
.mslot:hover .ph img.poster{transform:scale(1.02)}
.mslot .vig{pointer-events:none;position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.5),transparent,rgba(0,0,0,.2))}
.mslot .kind{position:absolute;left:1rem;top:1rem;display:inline-flex;align-items:center;gap:.35rem;border-radius:var(--r-pill);border:1px solid var(--line);background:rgba(0,0,0,.6);padding:.25rem .75rem;font-size:.68rem;font-weight:600;letter-spacing:.12em;color:var(--acc2);backdrop-filter:blur(4px)}
.mslot .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.mslot .play i{position:relative;display:flex;height:4rem;width:4rem;align-items:center;justify-content:center;border-radius:99px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.55);color:#fff;backdrop-filter:blur(4px);transition:.2s}
@media(min-width:640px){.mslot .play i{height:5rem;width:5rem}}
.mslot:hover .play i{transform:scale(1.05);background:rgba(0,0,0,.7)}
.mslot .play i::before{content:'';position:absolute;inset:-1px;border-radius:99px;border:1px solid var(--acc);animation:ping 2.4s cubic-bezier(0,0,.2,1) infinite}
.mslot .hint{position:absolute;bottom:.75rem;left:1rem;right:1rem;display:inline-flex;align-items:center;gap:.5rem;overflow:hidden;border-radius:.5rem;border:1px solid rgba(128,128,128,.4);background:rgba(0,0,0,.7);padding:.35rem .75rem;font-size:.72rem;color:#e8e8e8;backdrop-filter:blur(4px)}
.mslot .hint svg{flex:none;color:var(--acc2)}
.mslot .hint code{font-family:var(--font-m);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mslot video,.mslot img.real{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mslot.s4-3 .ph{aspect-ratio:4/3}

/* ===== Cards / grids ===== */
.grid8{margin-top:2.5rem;display:grid;grid-template-columns:1fr;gap:1rem;list-style:none}
@media(min-width:640px){.grid8{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1024px){.grid8{grid-template-columns:repeat(4,1fr);gap:1.5rem}}
.card{border:1px solid var(--line);background:var(--card);border-radius:var(--r-card);padding:1.25rem;transition:.2s}
@media(min-width:1024px){.card{padding:1.5rem}}
.card:hover{transform:translateY(-4px);border-color:var(--acc);background:var(--card-solid)}
.card .ic{display:inline-flex;height:2.75rem;width:2.75rem;align-items:center;justify-content:center;border-radius:.75rem;border:1px solid var(--line);background:var(--acc-soft);font-size:1.25rem}
.card h3{margin-top:1rem;font-size:1rem;font-weight:600;color:var(--txt);line-height:1.35}
@media(min-width:640px){.card h3{font-size:1.0625rem}}
.card p{margin-top:.5rem;font-size:.875rem;color:var(--mut);line-height:1.65}
.num{font-size:2.25rem;font-weight:900;line-height:1;color:var(--dim);font-family:var(--font-m)}

/* ===== Steps ===== */
.steps-list{margin-top:2.5rem;display:grid;grid-template-columns:1fr;gap:1.25rem;list-style:none}
@media(min-width:768px){.steps-list{grid-template-columns:repeat(3,1fr)}}
.step{position:relative;border:1px solid var(--line);background:var(--card);border-radius:var(--r-card);padding:1.5rem;transition:.2s}
.step:hover{border-color:var(--acc)}
.step .top{display:flex;align-items:center;justify-content:space-between}
.step .ic{display:flex;height:2.75rem;width:2.75rem;align-items:center;justify-content:center;border-radius:.75rem;border:1px solid var(--line);background:var(--acc-soft);font-size:1.25rem}
.step h3{margin-top:1rem;font-size:1.125rem;font-weight:600}
.step p{margin-top:.5rem;font-size:.875rem;color:var(--mut)}
.terminal{max-width:48rem;margin:2rem auto 0;overflow:hidden;border:1px solid var(--line);background:var(--term-bg);border-radius:var(--r-card);box-shadow:0 20px 40px rgba(0,0,0,.2)}
.terminal .bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.75rem;border-bottom:1px solid var(--line-soft);padding:.75rem 1.25rem}
.terminal .bar .t{display:flex;align-items:center;gap:.5rem;font-size:.875rem;font-weight:600;color:var(--txt2)}
.terminal .bar .t svg{color:var(--acc2)}
.copy-btn{display:inline-flex;align-items:center;gap:.375rem;border-radius:.5rem;border:1px solid var(--line);background:transparent;padding:.375rem .75rem;font-size:.75rem;font-weight:600;color:var(--txt2);transition:.15s}
.copy-btn:hover{border-color:var(--acc);color:var(--acc)}
.copy-btn.ok{border-color:var(--teal);color:var(--teal)}
.terminal pre{overflow-x:auto;padding:1rem 1.25rem;font-family:var(--font-m);font-size:.8125rem;line-height:1.7;color:var(--term-fg)}
.terminal pre .dollar{margin-right:.75rem;color:var(--acc);user-select:none}
.terminal pre span.l{display:block;white-space:pre}
.term-hint{margin-top:.75rem;text-align:center;font-size:.75rem;color:var(--mut2)}

/* ===== Dives ===== */
.dive{display:grid;grid-template-columns:1fr;align-items:center;gap:2rem}
@media(min-width:1024px){.dive{grid-template-columns:1fr 1fr;gap:3.5rem}}
.dive h2{margin-top:.5rem;font-family:var(--font-d);font-size:var(--fs-h2);font-weight:700;letter-spacing:-.01em;line-height:1.18}
.dive .text{margin-top:1rem;color:var(--mut);line-height:1.7}
.dive ul{margin-top:1.5rem;display:flex;flex-direction:column;gap:.625rem;list-style:none}
.dive li{display:flex;align-items:flex-start;gap:.625rem;font-size:.875rem;color:var(--txt2)}
.dive li svg{flex:none;margin-top:.15rem;color:var(--teal)}
.dives-stack{display:flex;flex-direction:column;gap:4rem;padding:4rem 0}
@media(min-width:1024px){.dives-stack{gap:7rem}}
.flip .tdesc{order:2}
.flip .tmedia{order:1}
@media(min-width:1024px){.flip .tdesc{order:2}.flip .tmedia{order:1}}

/* ===== Gallery ===== */
.gal{margin-top:2.5rem;display:grid;grid-template-columns:1fr;gap:1.25rem}
@media(min-width:640px){.gal{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1024px){.gal{grid-template-columns:repeat(3,1fr);gap:1.5rem}}
.gal figure .shot{display:block;width:100%;text-align:left;cursor:zoom-in;border-radius:var(--r-card)}
.gal .frame{position:relative;display:block;overflow:hidden;border:1px solid var(--line);background:var(--bg2);border-radius:var(--r-card);box-shadow:0 20px 40px rgba(0,0,0,.15);transition:.2s}
.gal figure:hover .frame{border-color:var(--acc)}
.gal .frame .kind{position:absolute;left:.75rem;top:.75rem;display:inline-flex;align-items:center;gap:.3rem;border-radius:var(--r-pill);border:1px solid var(--line);background:rgba(0,0,0,.6);padding:.1rem .55rem;font-size:.6rem;font-weight:600;letter-spacing:.12em;color:var(--acc2);backdrop-filter:blur(4px)}
.gal .frame .hint{position:absolute;bottom:.6rem;left:.75rem;right:.75rem;display:inline-flex;align-items:center;gap:.35rem;overflow:hidden;border-radius:.5rem;border:1px solid rgba(128,128,128,.4);background:rgba(0,0,0,.7);padding:.25rem .55rem;font-size:.66rem;color:#e8e8e8;backdrop-filter:blur(4px)}
.gal .frame .hint svg{flex:none;color:var(--acc2)}
.gal .frame .hint code{font-family:var(--font-m);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gal figcaption{margin-top:.625rem;padding:0 .25rem;font-size:.875rem;color:var(--mut);transition:.15s}
.gal figure:hover figcaption{color:var(--txt)}

/* ===== CTA band ===== */
.cta-band{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:var(--r-card);background:var(--card);padding:2.5rem 1.5rem}
@media(min-width:640px){.cta-band{padding:2.5rem}}
@media(min-width:1024px){.cta-band{padding:3.5rem}}
.cta-band .dots{pointer-events:none;position:absolute;inset:0;opacity:.4;background-image:radial-gradient(var(--dot-c) 1px,transparent 1px);background-size:22px 22px}
.cta-band .in{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:1.5rem}
@media(min-width:1024px){.cta-band .in{flex-direction:row;align-items:center;justify-content:space-between}}
.cta-band h2{font-family:var(--font-d);font-size:var(--fs-h2);font-weight:700;letter-spacing:-.01em}
.cta-band p{margin-top:.5rem;color:var(--txt2)}
.cta-band .acts{display:flex;width:100%;flex-direction:column;gap:.75rem}
@media(min-width:640px){.cta-band .acts{width:auto;flex-direction:row}}

/* ===== Tables (compare / matrix) ===== */
.tbl-wrap{margin-top:2.5rem;overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-card)}
table.cmp{width:100%;min-width:680px;border-collapse:collapse;text-align:left}
table.cmp th,table.cmp td{padding:.875rem 1.25rem}
table.cmp thead tr{border-bottom:1px solid var(--line);background:var(--bg2)}
table.cmp thead th{font-size:.875rem;font-weight:600;color:var(--txt2);text-align:center}
table.cmp thead th:first-child{text-align:left}
table.cmp thead th.hl{background:var(--acc-soft);color:var(--acc)}
table.cmp tbody tr{border-bottom:1px solid var(--line-soft)}
table.cmp tbody tr:last-child{border-bottom:0}
table.cmp tbody tr:nth-child(2n){background:var(--tint)}
table.cmp tbody th{font-size:.875rem;font-weight:500;color:var(--txt2)}
table.cmp td{font-size:.875rem;text-align:center;white-space:nowrap}
table.cmp td.hl{background:var(--acc-soft);font-weight:500}
.cell-yes{display:inline-flex;align-items:center;gap:.35rem;font-weight:600;color:var(--acc)}
.cell-no{color:var(--dim)}
.cell-part{display:inline-flex;align-items:center;gap:.35rem;color:var(--txt2)}
.cell-tag{display:inline-flex;align-items:center;border-radius:var(--r-pill);border:1px solid var(--line);padding:.125rem .625rem;font-size:.72rem;font-weight:500;color:var(--txt2)}
.cell-tag.plan{color:var(--mut2)}
.tbl-note{margin-top:.75rem;font-size:.75rem;color:var(--mut2)}
.hotwrap{margin-top:2.5rem}
.hotwrap h3{font-size:1.125rem;font-weight:600;margin-bottom:1rem}
.hotkeys{display:flex;flex-wrap:wrap;gap:.5rem}
.hk{display:inline-flex;align-items:center;gap:.5rem;border-radius:.75rem;border:1px solid var(--line);background:var(--card);padding:.5rem .875rem;font-size:.75rem;color:var(--mut)}
.hk kbd{font-family:var(--font-m);font-size:.72rem;font-weight:600;color:var(--acc);background:var(--acc-soft);border:1px solid var(--line);border-radius:.375rem;padding:.1rem .4rem}

/* ===== Early users ===== */
.egrid{margin-top:2.5rem;display:grid;grid-template-columns:1fr;gap:1rem}
@media(min-width:768px){.egrid{grid-template-columns:repeat(3,1fr)}}
.ecard{display:flex;flex-direction:column;border:1px solid var(--line);background:var(--card);border-radius:var(--r-card);padding:1.5rem;transition:.2s}
.ecard:hover{transform:translateY(-4px);border-color:var(--acc)}
.ecard .ic{display:inline-flex;height:2.75rem;width:2.75rem;align-items:center;justify-content:center;border-radius:.75rem;border:1px solid var(--line);background:var(--acc-soft);font-size:1.25rem}
.ecard h3{margin-top:1rem;font-size:1rem;font-weight:600;color:var(--txt);line-height:1.35}
@media(min-width:640px){.ecard h3{font-size:1.0625rem}}
.ecard p{margin-top:.5rem;font-size:.875rem;color:var(--mut);line-height:1.65}
.eacts{margin-top:2rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.75rem}
@media(min-width:640px){.eacts{flex-direction:row}}
.eacts .btn{width:100%}
@media(min-width:640px){.eacts .btn{width:auto}}

/* ===== FAQ ===== */
.faq-grid{display:grid;grid-template-columns:1fr;gap:2.5rem}
@media(min-width:1024px){.faq-grid{grid-template-columns:1fr 2fr;gap:3.5rem}}
.faq-list{border-top:1px solid var(--line)}
.faq-item{border-bottom:1px solid var(--line)}
.faq-item summary{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1.25rem 0;cursor:pointer;list-style:none;font-size:1rem;font-weight:600;color:var(--txt);transition:.15s}
@media(min-width:640px){.faq-item summary{font-size:1.0625rem}}
.faq-item summary::-webkit-details-marker{display:none}
.faq-item summary:hover,.faq-item[open] summary{color:var(--acc)}
.faq-item summary .chev{flex:none;transition:transform .2s;color:var(--mut)}
.faq-item[open] summary .chev{transform:rotate(180deg)}
.faq-item .ans{padding:0 0 1.25rem;font-size:.875rem;color:var(--mut);line-height:1.7}
@media(min-width:640px){.faq-item .ans{font-size:.9375rem}}

/* ===== Community ===== */
.plat-grid{margin-top:2.5rem;display:grid;grid-template-columns:1fr;gap:1rem}
@media(min-width:640px){.plat-grid{grid-template-columns:repeat(2,1fr)}}
.plat{display:flex;align-items:center;gap:1rem;border:1px solid var(--line);background:var(--card);border-radius:var(--r-card);padding:1.25rem;transition:.2s}
@media(min-width:1024px){.plat{padding:1.5rem}}
.plat:hover{transform:translateY(-4px);border-color:var(--acc)}
.plat.primary{border-color:var(--acc);background:var(--acc-soft)}
.plat .ic{flex:none;display:flex;height:3rem;width:3rem;align-items:center;justify-content:center;border-radius:.75rem;border:1px solid var(--line);background:var(--bg2);font-size:1.3rem;transition:.15s}
.plat:hover .ic{color:var(--acc)}
.plat.primary .ic{border-color:var(--acc);background:var(--acc-soft)}
.plat .mid{flex:1;min-width:0}
.plat .nm{display:flex;align-items:center;gap:.5rem;font-size:1rem;font-weight:600}
@media(min-width:640px){.plat .nm{font-size:1.0625rem}}
.plat .nm .star{display:none;border-radius:99px;background:var(--acc);padding:.05rem .5rem;font-size:.625rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--pill-on-fg)}
@media(min-width:640px){.plat .nm .star{display:inline}}
.plat .role{margin-top:.125rem;font-size:.875rem;color:var(--mut);line-height:1.45}
.plat .arr{flex:none;color:var(--dim);transition:.2s}
.plat:hover .arr{color:var(--acc);transform:translate(.125rem,-.125rem)}
.donate{margin-top:2rem;display:flex;flex-direction:column;align-items:flex-start;gap:1rem;border:1px solid var(--rose);border-radius:var(--r-card);background:var(--acc-soft);padding:1.5rem}
@media(min-width:640px){.donate{flex-direction:row;align-items:center;padding:2rem}}
.donate .ic{flex:none;display:flex;height:3rem;width:3rem;align-items:center;justify-content:center;border-radius:.75rem;background:var(--acc-soft);color:var(--rose);font-size:1.3rem}
.donate h3{font-size:1.125rem;font-weight:600}
.donate p{margin-top:.25rem;font-size:.875rem;color:var(--mut)}
.donate .acts{display:flex;flex-wrap:wrap;gap:.625rem}
.donate .acts a{display:inline-flex;align-items:center;gap:.5rem;border-radius:var(--r-btn);background:var(--rose);padding:.625rem 1.25rem;font-size:.875rem;font-weight:600;color:#fff;transition:.2s}
.donate .acts a:hover{filter:brightness(1.1);transform:translateY(-2px)}

/* ===== Final CTA ===== */
#final-cta{position:relative;overflow:hidden;border-top:1px solid var(--line-soft)}
#final-cta .bg{pointer-events:none;position:absolute;inset:0;background-image:radial-gradient(circle at 50% 0%,var(--acc-soft),transparent 55%),radial-gradient(var(--dot-c) 1px,transparent 1px);background-size:auto,24px 24px}
#final-cta .in{position:relative;max-width:56rem;margin:0 auto;padding:5rem 1rem;text-align:center}
@media(min-width:1024px){#final-cta .in{padding:7rem 1rem}}
#final-cta h2{font-family:var(--font-d);font-size:var(--fs-h1);font-weight:800;letter-spacing:-.02em;line-height:1.12}
#final-cta p{margin:1rem auto 0;max-width:36rem;color:var(--mut)}
#final-cta .acts{margin-top:2rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.75rem}
@media(min-width:640px){#final-cta .acts{flex-direction:row}}
#final-cta .acts .btn{width:100%}
@media(min-width:640px){#final-cta .acts .btn{width:auto}}
#final-cta .support{margin-top:1.5rem;font-size:.875rem;color:var(--mut2)}
#final-cta .support a{display:inline-flex;align-items:center;gap:.25rem;font-weight:600;color:var(--rose)}
#final-cta .support a:hover{filter:brightness(1.15)}

/* ===== Footer ===== */
footer.site{margin-top:auto;border-top:1px solid var(--line-soft);background:var(--bg);padding-bottom:env(safe-area-inset-bottom)}
.fgrid{display:grid;grid-template-columns:1fr;gap:2.5rem;padding:3rem 0}
@media(min-width:640px){.fgrid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1024px){.fgrid{grid-template-columns:repeat(4,1fr)}}
.fgrid .brand{grid-column:span 1}
@media(min-width:640px){.fgrid .brand{grid-column:span 2}}
footer.site p.tag{margin-top:.75rem;max-width:24rem;font-size:.875rem;color:var(--mut)}
footer.site p.built{margin-top:.5rem;font-size:.72rem;color:var(--dim)}
footer.site h3{font-size:.875rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--txt2)}
footer.site ul.col{margin-top:.75rem;display:flex;flex-direction:column;gap:.5rem;list-style:none}
footer.site ul.col a{font-size:.875rem;color:var(--mut)}
footer.site ul.col a:hover{color:var(--acc)}
.fplat{margin-top:1.25rem;display:flex;flex-wrap:wrap;gap:.5rem}
.fplat a{display:flex;height:2.25rem;width:2.25rem;align-items:center;justify-content:center;border-radius:.5rem;border:1px solid var(--line);background:var(--bg2);font-size:1rem;transition:.15s}
.fplat a:hover{border-color:var(--acc)}
.fbottom{display:flex;flex-direction:column;gap:.75rem;border-top:1px solid var(--line-soft);padding:1.5rem 0;font-size:.72rem;color:var(--mut2)}
@media(min-width:640px){.fbottom{flex-direction:row;align-items:center;justify-content:space-between}}
.fbottom a{color:var(--mut2)}
.fbottom a:hover{color:var(--txt2);text-decoration:underline;text-underline-offset:2px}
.fbottom .disc{max-width:42rem;line-height:1.6}

/* ===== Sticky mobile CTA ===== */
#stickyCta{position:fixed;inset-inline:0;bottom:0;z-index:40;border-top:1px solid var(--line);background:var(--head-bg);backdrop-filter:blur(12px);transform:translateY(100%);transition:transform .3s ease;pointer-events:none}
#stickyCta.show{transform:translateY(0);pointer-events:auto}
#stickyCta .in{max-width:48rem;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:.625rem;padding:.75rem 1rem max(.75rem,env(safe-area-inset-bottom))}
#stickyCta a{display:inline-flex;min-height:44px;align-items:center;justify-content:center;gap:.5rem;border-radius:var(--r-btn);padding:0 1rem;font-size:.875rem;font-weight:600}
#stickyCta .a1{background:var(--btn-bg);color:var(--btn-fg);box-shadow:var(--btn-glow)}
#stickyCta .a2{border:1px solid var(--line);background:var(--card-solid);color:var(--txt)}
@media(min-width:1024px){#stickyCta{display:none}}

/* ===== Lightbox ===== */
#lightbox{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(8,4,18,.88);backdrop-filter:blur(6px);padding:1rem}
#lightbox.open{display:flex}
#lightbox .box{max-width:56rem;width:100%}
#lightbox .ttl{padding:.25rem .25rem .5rem;font-size:.9375rem;font-weight:600;color:#fff}
#lightbox .img{overflow:hidden;border:1px solid var(--line);border-radius:.75rem}
#lightbox img{width:100%;aspect-ratio:4/3;object-fit:cover}
#lightbox .path{padding:.5rem .25rem 0;font-family:var(--font-m);font-size:.68rem;color:rgba(255,255,255,.55)}
#lightbox .close{position:absolute;top:1rem;right:1rem;display:flex;height:2.5rem;width:2.5rem;align-items:center;justify-content:center;border-radius:.75rem;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff}

/* ============================================================
   DARK — retrowave / neonwave decorations
   ============================================================ */
[data-theme="dark"] .hero .bg{background-image:none}
[data-theme="dark"] .hero .bg::before{
  content:'';position:absolute;left:50%;bottom:-46%;transform:translateX(-50%);
  width:min(64rem,140vw);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 50% 34%,#ffd319 0%,#ff9a3d 26%,#ff2975 46%,#b5179e 62%,rgba(138,43,226,.4) 72%,transparent 78%);
  opacity:.34;filter:blur(2px);
  -webkit-mask-image:repeating-linear-gradient(180deg,#000 0 30px,transparent 30px 38px);
  mask-image:repeating-linear-gradient(180deg,#000 0 30px,transparent 30px 38px);
}
[data-theme="dark"] .hero .bg::after{
  content:'';position:absolute;left:-25%;right:-25%;bottom:-14%;height:60%;
  background-image:linear-gradient(rgba(255,46,196,.3) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,.22) 1px,transparent 1px);
  background-size:44px 44px;
  transform:perspective(480px) rotateX(58deg);transform-origin:50% 0;
  -webkit-mask-image:linear-gradient(transparent,#000 32%);
  mask-image:linear-gradient(transparent,#000 32%);
  opacity:.5;
}
[data-theme="dark"] body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:90;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.026) 0 1px,transparent 1px 3px);
}
[data-theme="dark"] h1 .acc{
  background:linear-gradient(92deg,#ff2ec4,#ff7a3d 45%,#00e5ff);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  font-style:normal;
  filter:drop-shadow(0 0 18px rgba(255,46,196,.35));
}
[data-theme="dark"] .logo .name b{color:#ff2ec4;text-shadow:0 0 14px rgba(255,46,196,.55)}
[data-theme="dark"] .kicker{color:var(--acc2);text-shadow:0 0 12px rgba(0,229,255,.45)}
[data-theme="dark"] .badge{border-color:rgba(0,229,255,.4);color:#9df2ff;text-shadow:0 0 10px rgba(0,229,255,.35);background:rgba(0,229,255,.04)}
[data-theme="dark"] .mslot{border-color:rgba(0,229,255,.28);box-shadow:0 0 44px rgba(124,58,237,.22),0 20px 40px rgba(0,0,0,.5)}
[data-theme="dark"] .mslot .kind{color:#9df2ff;border-color:rgba(0,229,255,.4);text-shadow:0 0 8px rgba(0,229,255,.6)}
[data-theme="dark"] .stat b{text-shadow:0 0 16px rgba(0,229,255,.4)}
[data-theme="dark"] .card:hover{box-shadow:0 0 30px rgba(255,46,196,.12)}
[data-theme="dark"] .pcard:hover{box-shadow:0 0 34px rgba(255,46,196,.14)}
[data-theme="dark"] .plat.primary{box-shadow:0 0 30px rgba(255,46,196,.16)}
[data-theme="dark"] .cta-band{border-color:rgba(255,46,196,.4);background:linear-gradient(135deg,rgba(255,46,196,.09),rgba(124,58,237,.08) 55%,rgba(0,229,255,.05));box-shadow:0 0 50px rgba(255,46,196,.09)}
[data-theme="dark"] .cell-yes{text-shadow:0 0 10px rgba(0,229,255,.5)}
[data-theme="dark"] .rm.prog{box-shadow:0 0 24px rgba(255,46,196,.12)}
[data-theme="dark"] #final-cta .bg{background-image:radial-gradient(circle at 50% 0%,rgba(255,46,196,.16),transparent 55%),radial-gradient(rgba(0,229,255,.07) 1px,transparent 1px);background-size:auto,26px 26px}
[data-theme="dark"] .btn-ghost:hover{border-color:var(--acc2);color:var(--acc2)}
[data-theme="dark"] .pcard .pnum{color:transparent;-webkit-text-stroke:1px rgba(0,229,255,.4)}

/* ============================================================
   LIGHT — typography / editorial decorations
   ============================================================ */
[data-theme="light"] .kicker::before{content:'—\00a0\00a0'}
[data-theme="light"] .sec-head{border-top:2px solid var(--txt);padding-top:1.25rem}
[data-theme="light"] h1{letter-spacing:-.015em}
[data-theme="light"] .hero .who a{border:none;border-radius:0;padding:.3rem .15rem;text-transform:uppercase;letter-spacing:.12em;font-size:.72rem;font-weight:600;color:var(--mut)}
[data-theme="light"] .hero .who a:hover{color:var(--acc)}
[data-theme="light"] .btn-amber{letter-spacing:.02em}
[data-theme="light"] .btn-amber:hover{background:var(--acc);color:#fff;filter:none;transform:translateY(-1px)}
[data-theme="light"] .btn-ghost{background:var(--card)}
[data-theme="light"] .btn-ghost:hover{border-color:var(--txt);color:var(--txt)}
[data-theme="light"] .stat{background:transparent;border:none;border-top:1px solid var(--line);border-radius:0;padding:1rem .25rem}
[data-theme="light"] .stat:hover{border-top-color:var(--txt)}
[data-theme="light"] .stat b{font-size:1.6rem;font-style:italic}
[data-theme="light"] .pcard{background:transparent;border:none;border-top:2px solid var(--txt);border-radius:0;padding:1.25rem .25rem 1rem}
[data-theme="light"] .pcard:hover{transform:none;border-top-color:var(--acc)}
[data-theme="light"] .pcard .pgoal{font-size:1.18rem;line-height:1.3}
[data-theme="light"] .pcard:hover .pgoal{color:var(--acc)}
[data-theme="light"] .pcard .pnum{color:#ddd3bf}
[data-theme="light"] .card{box-shadow:0 1px 0 rgba(30,26,20,.03)}
[data-theme="light"] .card:hover{transform:translateY(-2px);border-color:var(--txt);box-shadow:0 10px 30px rgba(30,26,20,.08)}
[data-theme="light"] .card h3{font-family:var(--font-d);font-size:1.15rem;font-weight:700}
[data-theme="light"] .mslot{box-shadow:0 18px 40px rgba(30,26,20,.12)}
[data-theme="light"] .mslot .kind{color:#f2ede0}
[data-theme="light"] .terminal{border-color:var(--term-bg)}
[data-theme="light"] .copy-btn{border-color:rgba(250,247,241,.3);color:#d8d2c2}
[data-theme="light"] .copy-btn:hover{border-color:#fff;color:#fff}
[data-theme="light"] .cta-band{background:#211c15;border-color:#211c15;color:#f4efe4}
[data-theme="light"] .cta-band p{color:#c9c1ae}
[data-theme="light"] .cta-band .dots{background-image:radial-gradient(rgba(250,247,241,.16) 1px,transparent 1px)}
[data-theme="light"] .cta-band .btn-amber{background:#faf7f1;color:#1e1a14;box-shadow:none}
[data-theme="light"] .cta-band .btn-amber:hover{background:#fff;color:#1e1a14;filter:none}
[data-theme="light"] .cta-band .btn-ghost{background:transparent;border-color:rgba(250,247,241,.4);color:#f4efe4}
[data-theme="light"] .cta-band .btn-ghost:hover{border-color:#fff;color:#fff}
[data-theme="light"] .qcard blockquote{font-family:var(--font-d);font-style:italic;font-size:1.02rem;color:var(--txt2)}
[data-theme="light"] .faq-item summary{font-family:var(--font-d);font-size:1.125rem;font-weight:700}
[data-theme="light"] .donate{background:rgba(179,55,44,.05)}
[data-theme="light"] .step:hover{border-color:var(--txt)}
[data-theme="light"] .rm:hover{border-color:var(--txt)}
[data-theme="light"] .hk kbd{background:var(--bg2)}
[data-theme="light"] .num{color:#ddd3bf;font-weight:600}
[data-theme="light"] .logo .mark{border-radius:.6rem}
[data-theme="light"] .gal figure:hover .frame{border-color:var(--txt)}
[data-theme="light"] .cell-yes{color:#15803d}
[data-theme="light"] table.cmp thead th.hl{color:var(--txt);background:var(--bg2)}
[data-theme="light"] table.cmp td.hl{color:var(--txt)}
</style>
</head>
<body>

<div id="announcement"></div>

<header class="site">
  <div class="wrap hrow">
    <a class="logo" href="#" aria-label="CanvasDesk — home">
      <span class="mark"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 17.5 12 6l7 11.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="5" cy="17.5" r="1.8" fill="currentColor" stroke="none"/><circle cx="12" cy="6" r="1.8" fill="currentColor" stroke="none"/><circle cx="19" cy="17.5" r="1.8" fill="currentColor" stroke="none"/></svg></span>
      <span class="name">Canvas<b>Desk</b></span>
    </a>
    <nav class="main" aria-label="Main" id="navMain"></nav>
    <div class="hactions">
      <nav class="lang-pills" id="langPills" aria-label="Language"><span class="li" data-icon="lang"></span></nav>
      <button class="tbtn" id="themeBtn" aria-label="Toggle color theme"><span class="isun" data-icon="sun"></span><span class="imoon" data-icon="moon"></span></button>
      <a class="btn-star" id="starBtn" target="_blank" rel="noopener noreferrer"></a>
      <button class="burger" id="burger" aria-expanded="false" aria-controls="mobileNav" aria-label="Menu"><span data-icon="menu"></span></button>
    </div>
  </div>
  <nav id="mobileNav" aria-label="Mobile"></nav>
</header>

<main>
  <section class="hero" id="demo">
    <div class="bg" aria-hidden="true"></div>
    <div class="wrap in" id="heroIn"></div>
  </section>

  <section id="personas"><div class="wrap sec-pad" id="personasIn"></div></section>

  <section class="trust" aria-label="Trust"><div class="wrap in" id="trustIn"></div></section>

  <section id="features"><div class="wrap sec-pad" id="featuresIn"></div></section>
  <section id="steps"><div class="wrap sec-pad" id="stepsIn"></div></section>

  <div class="wrap dives-stack" id="divesIn"></div>

  <section id="gallery"><div class="wrap sec-pad" id="galleryIn"></div></section>

  <section aria-labelledby="ctaband-title"><div class="wrap"><div class="sec-pad" style="padding-top:4rem;padding-bottom:1rem" id="ctaBandIn"></div></div></section>

  <section id="compare"><div class="wrap sec-pad" id="compareIn"></div></section>
  <section id="platforms"><div class="wrap sec-pad" id="matrixIn"></div></section>

  <section id="early" class="tint"><div class="wrap sec-pad" id="earlyIn"></div></section>
  <section id="faq"><div class="wrap sec-pad" id="faqIn"></div></section>
  <section id="community" class="tint"><div class="wrap sec-pad" id="communityIn"></div></section>
  <section id="final-cta"><div class="bg" aria-hidden="true"></div><div class="in" id="finalCtaIn"></div></section>
</main>

<footer class="site"><div class="wrap"><div id="footerIn"></div></div></footer>

<div id="stickyCta" aria-hidden="true"><div class="in" id="stickyIn"></div></div>

<div id="lightbox" role="dialog" aria-modal="true" aria-label="Screenshot preview">
  <button class="close" id="lbClose" aria-label="Close"><span data-icon="x"></span></button>
  <div class="box">
    <div class="ttl" id="lbTitle"></div>
    <div class="img"><img id="lbImg" src="" alt=""></div>
    <div class="path" id="lbPath"></div>
  </div>
</div>

<script src="config.js"></script>
<script>
/* ===== Иконки (lucide-совместимые inline SVG) ===== */
const I = (name, size = 16, cls = '') => {
  const P = {
    star: '<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26"/>',
    starFill: '<polygon fill="currentColor" points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26"/>',
    download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/>',
    play: '<polygon fill="currentColor" points="6 3 20 12 6 21 6 3"/>',
    heart: '<path fill="currentColor" d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>',
    github: '<path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/>',
    check: '<path d="M20 6 9 17l-5-5"/>',
    minus: '<path d="M5 12h14"/>',
    shield: '<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/>',
    spark: '<path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/>',
    clock: '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
    fork: '<circle cx="12" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><circle cx="18" cy="6" r="3"/><path d="M18 9v2c0 .6-.4 1-1 1H7c-.6 0-1-.4-1-1V9"/><path d="M12 12v3"/>',
    folder: '<path d="M2 9V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H20a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9"/><path d="M12 10v6"/><path d="m9 13 3 3 3-3"/>',
    image: '<rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>',
    upRight: '<path d="M7 7h10v10"/><path d="M7 17 17 7"/>',
    right: '<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
    book: '<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',
    mouse: '<path d="m4 4 7.07 17 2.51-7.39L21 11.07z"/>',
    menu: '<line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="18" y2="18"/>',
    x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
    copy: '<rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>',
    dot: '<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="1" fill="currentColor"/>',
    circleCheck: '<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>',
    dashed: '<circle cx="12" cy="12" r="10" stroke-dasharray="4.6 3.4"/>',
    commit: '<circle cx="12" cy="12" r="3"/><line x1="3" x2="9" y1="12" y2="12"/><line x1="15" x2="21" y1="12" y2="12"/>',
    lang: '<path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/>',
    quote: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M8 12v3"/><path d="M12 12v3"/><path d="M16 12v3"/>',
    pkg: '<path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/><path d="M12 22V12"/><path d="m3.3 7 8.7 5 8.7-5"/>',
    sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>',
    moon: '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',
    chev: '<path d="m6 9 6 6 6-6"/>'
  }[name] || '';
  return `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="${cls}">${P}</svg>`;
};

/* ===== Язык: ?lang → localStorage → браузер → en ===== */
let LANG = (() => {
  const q = new URLSearchParams(location.search).get('lang');
  if (q === 'ru' || q === 'en') return q;
  const s = localStorage.getItem(LANG_KEY);
  if (s === 'ru' || s === 'en') return s;
  return (navigator.language || 'en').toLowerCase().startsWith('ru') ? 'ru' : 'en';
})();

const $ = sel => document.querySelector(sel);
const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const NAV_IDS = ['features', 'demo', 'steps', 'widgets', 'ai', 'faq', 'community'];

/* Медиа-слот: постер + бейдж типа + play + подсказка; при src — реальное видео/картинка */
function mediaSlot(cfg, key, kind, title, hint) {
  const m = cfg.media[key] || {};
  const src = m.src || '';
  const kindLabel = kind === 'video' ? (LANG === 'ru' ? 'ВИДЕО' : 'VIDEO') : kind.toUpperCase();
  const overlay = src ? '' : `
    <span class="kind">${kind === 'video' ? I('play', 12) : I('image', 12)} ${kindLabel}</span>
    ${kind !== 'screenshot' ? `<span class="play"><i>${I('play', 28)}</i></span>` : ''}
    <span class="hint">${I('folder', 14)}<code>${esc(hint)}</code></span>`;
  const real = !src ? '' : /\.(mp4|webm|ogg|mov)(\?|$)/i.test(src)
    ? `<video src="${esc(src)}" poster="${esc(m.poster)}" controls preload="metadata"></video>`
    : `<img class="real" src="${esc(src)}" alt="${esc(title)}" loading="lazy">`;
  return `<figure class="mslot">
    <div class="ph">
      <img class="poster" src="${esc(m.poster)}" alt="${esc(title)}">
      <div class="vig" aria-hidden="true"></div>
      ${overlay}${real}
    </div>
    <figcaption class="sr-only">${esc(title)}</figcaption>
  </figure>`;
}

function platHref(cfg, id, suffix = '') { const u = cfg.links[id]; return u ? u + suffix : cfg.links.github + suffix; }

/* ===== Рендер секций ===== */
function render(cfg) {
  const T = o => t(o, LANG);
  document.documentElement.lang = LANG;

  /* SEO + OG + JSON-LD */
  document.title = T(cfg.seo.title);
  const meta = (n, c, a = 'name') => {
    let el = document.head.querySelector(`meta[${a}="${n}"]`);
    if (!el) { el = document.createElement('meta'); el.setAttribute(a, n); document.head.appendChild(el); }
    el.setAttribute('content', c);
  };
  meta('description', T(cfg.seo.description));
  meta('keywords', T(cfg.seo.keywords));
  meta('og:title', T(cfg.seo.title), 'property');
  meta('og:description', T(cfg.seo.description), 'property');
  meta('og:image', cfg.seo.ogImage, 'property');
  const faqLd = cfg.faq.items.map(x => ({ '@type': 'Question', name: T(x.q), acceptedAnswer: { '@type': 'Answer', text: T(x.a) } }));
  const howLd = cfg.steps.items.map((s, i) => ({ '@type': 'HowToStep', position: i + 1, name: T(s.title), text: T(s.text) }));
  $('#ldjson').textContent = JSON.stringify([{
    '@context': 'https://schema.org', '@type': 'SoftwareApplication',
    name: cfg.brand.name, applicationCategory: 'DesktopApplication', operatingSystem: 'Windows, Linux, macOS',
    description: T(cfg.seo.description), url: location.origin, offers: { '@type': 'Offer', price: '0', priceCurrency: 'USD' }
  }, {
    '@context': 'https://schema.org', '@type': 'FAQPage', mainEntity: faqLd
  }, {
    '@context': 'https://schema.org', '@type': 'HowTo', name: LANG === 'ru' ? 'Как начать работать с CanvasDesk' : 'How to get started with CanvasDesk', step: howLd
  }]);

  /* Announcement */
  const annHref = cfg.links.webapp || (LANG === 'ru' ? platHref(cfg, 'habr') : platHref(cfg, 'medium'));
  $('#announcement').innerHTML = `<div class="in"><span style="display:inline-flex;align-items:center;gap:.375rem;font-weight:600">${I('spark', 14)} ${T(cfg.announcement.text)}</span>
    <a class="cta" href="${esc(annHref)}" target="_blank" rel="noopener noreferrer">${T(cfg.announcement.cta)} <span aria-hidden="true">→</span></a></div>`;

  /* Header nav + lang pills + star */
  $('#navMain').innerHTML = NAV_IDS.map(id => `<a href="#${id}">${T(cfg.nav[id])}</a>`).join('');
  $('#langPills').innerHTML = `<span class="li">${I('lang', 14)}</span>` + ['en', 'ru'].map(l =>
    `<button class="${LANG === l ? 'on' : ''}" data-lang="${l}" aria-current="${LANG === l ? 'true' : 'false'}">${l === 'ru' ? 'РУ' : 'EN'}</button>`).join('');
  $('#starBtn').innerHTML = `${I('github', 16)} ${T(cfg.nav.star)}`;
  $('#starBtn').href = cfg.links.github;
  $('#mobileNav').innerHTML = NAV_IDS.map(id => `<a href="#${id}">${T(cfg.nav[id])}</a>`).join('') +
    `<a class="btn-star" href="${esc(cfg.links.github)}" target="_blank" rel="noopener noreferrer">${I('github', 16)} ${T(cfg.nav.star)}</a>`;
  $('#burger').setAttribute('aria-label', T(cfg.nav.menu));

  /* Hero */
  $('#heroIn').innerHTML = `
    <div class="center">
      <p class="badge"><span class="dot"><i></i><b></b></span>${T(cfg.hero.badge)}</p>
      <h1>${T(cfg.hero.titleA)} <span class="acc">${T(cfg.hero.titleAccent)}</span></h1>
      <p class="sub">${T(cfg.hero.subtitle)}</p>
      <div class="who" aria-label="${LANG === 'ru' ? 'Кому подходит' : 'Who it is for'}">${(cfg.personas?.items || []).map(p => `<a href="#p-${esc(p.id)}">${T(p.title)}<span aria-hidden="true">→</span></a>`).join('')}</div>
      <div class="ctas">
        <a class="btn btn-amber" href="${esc(cfg.links.webapp || platHref(cfg, 'github', '/releases'))}" target="_blank" rel="noopener noreferrer">${I('spark', 18)} ${T(cfg.hero.ctaPrimary)}</a>
        <a class="btn btn-ghost" href="${esc(cfg.links.github)}" target="_blank" rel="noopener noreferrer">${I('starFill', 15)} ${T(cfg.hero.ctaSecondary)}</a>
        <a class="btn-link" href="${esc(cfg.links.docs || platHref(cfg, 'github', '#readme'))}" target="_blank" rel="noopener noreferrer">${I('book', 15)} ${T(cfg.hero.ctaTertiary)}</a>
      </div>
      <ul class="chips">${cfg.hero.chips.map(c => `<span>${I('mouse', 12)} ${esc(c)}</span>`).join('')}</ul>
    </div>
    <div class="hero-media"><div class="glow" aria-hidden="true"></div>${mediaSlot(cfg, 'heroDemo', 'video', T(cfg.hero.mediaTitle), T(cfg.hero.mediaHint))}</div>
    <dl class="stats">${cfg.stats.map(s => `<div class="stat"><dd><b>${esc(s.value)}</b></dd><span>${T(s.label)}</span></div>`).join('')}</dl>
    <p class="downstream"><a href="#community">${T(cfg.hero.communityLink)} ${I('right', 14)}</a></p>`;

  /* Personas — ответ на вопрос «зачем мне это» (первый скролл) */
  $('#personasIn').innerHTML = `
    <div class="sec-head">
      <p class="kicker">${T(cfg.personas.kicker)}</p>
      <h2 class="sec-title">${T(cfg.personas.title)}</h2>
      <p class="sec-sub">${T(cfg.personas.subtitle)}</p>
    </div>
    <div class="pgrid">${cfg.personas.items.map((p, i) => `
      <article class="pcard" id="p-${esc(p.id || i)}">
        <div class="ptop"><span class="pnum" aria-hidden="true">${String(i + 1).padStart(2, '0')}</span><span class="pic" aria-hidden="true">${esc(p.icon)}</span></div>
        <h3>${T(p.title)}</h3>
        <p class="pgoal">${T(p.goal)}</p>
        <p class="pproof">${T(p.proof)}</p>
        <a class="plink" href="${esc(p.href || cfg.links.webapp || platHref(cfg, 'github', '/releases'))}" target="_blank" rel="noopener noreferrer">${T(cfg.personas.cta)} <span aria-hidden="true">→</span></a>
      </article>`).join('')}</div>`;

  /* Trust strip (бейджи сразу; цифры GitHub подтянутся асинхронно) */
  $('#trustIn').innerHTML = `
    <dl class="metrics" id="trustMetrics"></dl>
    <ul class="badges">
      ${cfg.trust.badges[LANG].map(b => `<li class="pill">${I('shield', 13)} ${esc(b)}</li>`).join('')}
      <li><a class="pill amber" href="${esc(cfg.links.github)}" target="_blank" rel="noopener noreferrer">${I('starFill', 13)} ${T(cfg.nav.star)}</a></li>
    </ul>`;
  renderTrustMetrics(null);

  /* Features */
  $('#featuresIn').innerHTML = `
    <div class="sec-head">
      <p class="kicker">${T(cfg.features.kicker)}</p>
      <h2 class="sec-title">${T(cfg.features.title)}</h2>
      <p class="sec-sub">${T(cfg.features.subtitle)}</p>
    </div>
    <ul class="grid8">${cfg.features.items.map(f => `
      <li class="card"><span class="ic">${esc(f.icon)}</span><h3>${T(f.title)}</h3><p>${T(f.text)}</p></li>`).join('')}</ul>`;

  /* Steps */
  $('#stepsIn').innerHTML = `
    <div class="sec-head">
      <p class="kicker">${T(cfg.steps.kicker)}</p>
      <h2 class="sec-title">${T(cfg.steps.title)}</h2>
      <p class="sec-sub">${T(cfg.steps.subtitle)}</p>
    </div>
    <ol class="steps-list">${cfg.steps.items.map((s, i) => `
      <li class="step"><div class="top"><span class="ic">${esc(s.icon)}</span><span class="num" aria-hidden="true">${String(i + 1).padStart(2, '0')}</span></div>
      <h3>${T(s.title)}</h3><p>${T(s.text)}</p></li>`).join('')}</ol>
    <div class="terminal">
      <div class="bar"><span class="t">${I('pkg', 16)} ${T(cfg.steps.installTitle)}</span>
      <button class="copy-btn" id="copyBtn" data-cmd="${esc(cfg.steps.installCommands)}">${I('copy', 13)} <span>${T(cfg.steps.copy)}</span></button></div>
      <pre aria-label="${T(cfg.steps.installTitle)}">${cfg.steps.installCommands.split('\n').map(l => `<span class="l"><span class="dollar">$</span>${esc(l)}</span>`).join('')}</pre>
    </div>
    <p class="term-hint">${T(cfg.steps.installHint)}</p>`;

  /* Dives (4 чередующихся) */
  const diveDefs = [
    ['files', 'filesShot', 'screenshot'], ['widgets', 'widgetsGif', 'gif'],
    ['ai', 'aiShot', 'screenshot'], ['desktop', 'desktopVideo', 'video']
  ];
  $('#divesIn').innerHTML = diveDefs.map(([key, mkey, kind], i) => {
    const d = cfg.dives[key];
    const flip = i % 2 === 1;
    return `<section class="dive ${flip ? 'flip' : ''}" id="${key === 'widgets' ? 'widgets' : key === 'ai' ? 'ai' : 'dive-' + key}">
      <div class="tdesc">
        <p class="kicker">${T(d.kicker)}</p>

/* ===== Trust metrics: живые цифры GitHub (мягкая деградация) ===== */
function renderTrustMetrics(stats) {
  const el = $('#trustMetrics');
  if (!el) return;
  if (!stats) { el.innerHTML = ''; return; }
  const fmt = n => new Intl.NumberFormat(LANG === 'ru' ? 'ru-RU' : 'en-US').format(n);
  let days = null;
  if (stats.pushedAt) days = Math.floor((Date.now() - new Date(stats.pushedAt).getTime()) / 864e5);
  const commitLabel = days === null ? '' : (days < 1 ? t(CFG.trust.today, LANG) : new Intl.RelativeTimeFormat(LANG === 'ru' ? 'ru-RU' : 'en-US', { numeric: 'auto' }).format(-days, 'day'));
  el.innerHTML = `
    <div class="metric">${I('starFill', 20)}<b>${fmt(stats.stars)}</b><span>${t(CFG.trust.stars, LANG)}</span></div>
    <div class="metric">${I('fork', 20)}<b>${fmt(stats.forks)}</b><span>${t(CFG.trust.forks, LANG)}</span></div>
    ${commitLabel ? `<div class="metric">${I('clock', 20)}<b>${esc(commitLabel)}</b><span>${t(CFG.trust.commit, LANG)}</span></div>` : ''}`;
}

async function fetchRepoStats() {
  const KEY = 'cd_repo_stats';
  try {
    const c = JSON.parse(sessionStorage.getItem(KEY) || 'null');
    if (c && Date.now() - c.at < 36e5) return c.data;
  } catch (e) { /* ignore */ }
  try {
    const ctrl = new AbortController();
    const to = setTimeout(() => ctrl.abort(), 3500);
    const r = await fetch('https://api.github.com/repos/danku13/CanvasDesk', { headers: { Accept: 'application/vnd.github+json' }, signal: ctrl.signal });
    clearTimeout(to);
    if (!r.ok) return null;
    const j = await r.json();
    const data = { stars: j.stargazers_count || 0, forks: j.forks_count || 0, pushedAt: j.pushed_at };
    try { sessionStorage.setItem(KEY, JSON.stringify({ at: Date.now(), data })); } catch (e) { /* ignore */ }
    return data;
  } catch (e) { return null; }
}

/* ===== Взаимодействия ===== */
/* Тема: тумблер + meta theme-color; data-icon спаны заполняются иконками */
function setTheme(theme) {
  document.documentElement.dataset.theme = theme;
  try { localStorage.setItem('cd_theme', theme); } catch (e) { /* ignore */ }
  const m = document.querySelector('meta[name="theme-color"]');
  if (m) m.content = theme === 'light' ? '#faf7f1' : '#0a0118';
}
document.querySelectorAll('[data-icon]').forEach(el => { el.innerHTML = I(el.dataset.icon, 18); });
const themeBtn = $('#themeBtn');
if (themeBtn) themeBtn.addEventListener('click', () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'));
setTheme(document.documentElement.dataset.theme || 'dark');

document.addEventListener('click', e => {
  const langBtn = e.target.closest('[data-lang]');
  if (langBtn) { LANG = langBtn.dataset.lang; localStorage.setItem(LANG_KEY, LANG); render(CFG); fetchRepoStats().then(renderTrustMetrics); return; }
  const lbBtn = e.target.closest('[data-lb]');
  if (lbBtn) {
    const g = CFG.gallery.items[+lbBtn.dataset.lb];
    $('#lbTitle').textContent = t(g.title, LANG);
    $('#lbImg').src = g.src || g.poster || g.hint;
    $('#lbImg').alt = t(g.title, LANG);
    $('#lbPath').textContent = g.src || g.hint;
    $('#lightbox').classList.add('open');
    return;
  }
  if (e.target.closest('#lbClose') || e.target.id === 'lightbox') $('#lightbox').classList.remove('open');
  const cp = e.target.closest('#copyBtn');
  if (cp) {
    const txt = cp.dataset.cmd;
    const done = ok => { cp.classList.toggle('ok', ok); cp.querySelector('span').textContent = t(ok ? CFG.steps.copied : CFG.steps.copy, LANG); setTimeout(() => { cp.classList.remove('ok'); cp.querySelector('span').textContent = t(CFG.steps.copy, LANG); }, 1800); };
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(() => done(true), () => done(false));
    else { const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(true); } catch (err) { done(false); } ta.remove(); }
  }
  const b = e.target.closest('#burger');
  if (b) { const nav = $('#mobileNav'); const open = nav.classList.toggle('open'); b.setAttribute('aria-expanded', String(open)); b.firstElementChild.innerHTML = open ? I('x', 20) : I('menu', 20); }
  if (e.target.closest('#mobileNav a')) { $('#mobileNav').classList.remove('open'); $('#burger').firstElementChild.innerHTML = I('menu', 20); $('#burger').setAttribute('aria-expanded', 'false'); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#lightbox').classList.remove('open'); });

/* Sticky mobile CTA: после первого экрана, скрыт у финального CTA и в футере */
(function () {
  const bar = $('#stickyCta');
  let pastHero = false, nearEnd = false;
  let ctaVisible = false, footVisible = false;
  const update = () => {
    nearEnd = ctaVisible || footVisible;
    const v = pastHero && !nearEnd;
    bar.classList.toggle('show', v);
    bar.setAttribute('aria-hidden', String(!v));
    bar.querySelectorAll('a').forEach(a => a.tabIndex = v ? 0 : -1);
  };
  addEventListener('scroll', () => { pastHero = scrollY > innerHeight * 0.9; update(); }, { passive: true });
  new IntersectionObserver(es => { ctaVisible = es[0].isIntersecting; update(); }, { threshold: 0.05 }).observe($('#final-cta'));
  new IntersectionObserver(es => { footVisible = es[0].isIntersecting; update(); }, { threshold: 0.05 }).observe($('footer.site'));
})();

  const stats = await fetchRepoStats();
  if (stats) renderTrustMetrics(stats);
})();
